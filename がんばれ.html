<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>エヴァ15風 パチンコ SIM</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        #game-container {
            width: 400px;
            margin: 0 auto;
            background-color: #222;
            border: 4px solid #555;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 0 20px rgba(128, 0, 128, 0.5);
        }
        #status-bar {
            display: flex;
            justify-content: space-between;
            background: #333;
            padding: 8px;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 14px;
        }
        .mode-normal { color: #00ffff; }
        .mode-st { color: #ff00ff; animation: blink 0.5s infinite alternate; }
        @keyframes blink { from { opacity: 1; } to { opacity: 0.6; } }

        #screen {
            background: #000;
            border: 2px solid #888;
            height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        #reels {
            display: flex;
            gap: 15px;
            font-size: 64px;
            font-weight: bold;
            text-shadow: 0 0 10px #fff;
        }
        #effect-text {
            font-size: 20px;
            color: #ffcc00;
            height: 30px;
            margin-top: 15px;
            font-weight: bold;
        }
        #hold-container {
            margin: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .hold-ball {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #444;
            border: 1px solid #888;
        }
        .hold-blue { background: #0088ff; box-shadow: 0 0 5px #0088ff; }
        .hold-red { background: #ff0000; box-shadow: 0 0 8px #ff0000; }
        .hold-gold { background: #ffd700; box-shadow: 0 0 10px #ffd700; }

        #controls {
            margin-top: 15px;
        }
        button {
            padding: 12px 24px;
            font-size: 18px;
            background: linear-gradient(135deg, #8a2be2, #4b0082);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:active {
            transform: translateY(2px);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="status-bar">
        <span id="mode-display" class="mode-normal">通常モード</span>
        <span id="st-count"></span>
        <span>回転数: <span id="total-spins">0</span></span>
    </div>

    <div id="screen">
        <div id="reels">
            <span id="reel1">1</span>
            <span id="reel2">2</span>
            <span id="reel3">3</span>
        </div>
        <div id="effect-text"></div>
    </div>

    <div id="hold-container">
        <span>保留:</span>
        <div class="hold-ball" id="hold0"></div>
        <div class="hold-ball" id="hold1"></div>
        <div class="hold-ball" id="hold2"></div>
        <div class="hold-ball" id="hold3"></div>
    </div>

    <div id="controls">
        <button id="shoot-btn" onclick="addHold()">玉を打つ (ヘソ入賞)</button>
    </div>
</div>

<script>
    // パラメータ設定
    const RATES = {
        NORMAL: 319.7,     // 通常時の大当り確率
        ST: 99.4,          // ST中の大当り確率
        ST_RUSH_RATE: 0.70, // ST突入率
        ST_TURNS: 163
    };

    // ==========================================
    // 固定出目パターンの定義
    // ==========================================
    // 1. 完全ハズレ時の出目リスト（テンパイしないバラケ目）
    const FIXED_LOSE_PATTERNS = [
        [1, 2, 3],
        [2, 4, 6],
        [3, 5, 7],
        [4, 1, 5],
        [5, 8, 2],
        [6, 3, 9],
        [8, 2, 4]
    ];

    // 2. リーチ時に使用するテンパイ図柄（1〜9）
    const REACH_NUMBERS = [1, 2, 3, 4, 5, 6, 7, 8, 9];

    // ゲーム状態
    let totalSpins = 0;
    let isST = false;
    let stRemains = 0;
    let holds = [];
    let isSpinning = false;

    // DOM要素
    const elReel1 = document.getElementById('reel1');
    const elReel2 = document.getElementById('reel2');
    const elReel3 = document.getElementById('reel3');
    const elEffect = document.getElementById('effect-text');
    const elMode = document.getElementById('mode-display');
    const elStCount = document.getElementById('st-count');
    const elTotalSpins = document.getElementById('total-spins');

    // 玉を打つ（ヘソ入賞）
    function addHold() {
        if (holds.length >= 4) return;

        const currentRate = isST ? RATES.ST : RATES.NORMAL;
        const isWin = Math.random() < (1 / currentRate);
        
        holds.push({ isWin: isWin });
        updateHoldUI();

        if (!isSpinning) {
            startNextSpin();
        }
    }

    // 保留表示の更新
    function updateHoldUI() {
        for (let i = 0; i < 4; i++) {
            const ball = document.getElementById(`hold${i}`);
            ball.className = 'hold-ball';
            if (i < holds.length) {
                if (holds[i].isWin && Math.random() < 0.8) {
                    ball.classList.add('hold-red');
                } else if (Math.random() < 0.05) {
                    ball.classList.add('hold-blue');
                } else {
                    ball.classList.add('hold-blue');
                }
            }
        }
    }

    // 変動開始
    function startNextSpin() {
        if (holds.length === 0) {
            isSpinning = false;
            return;
        }

        isSpinning = true;
        const currentSpinData = holds.shift();
        updateHoldUI();

        totalSpins++;
        elTotalSpins.textContent = totalSpins;

        if (isST) {
            stRemains--;
            elStCount.textContent = `ST残り: ${stRemains}回`;
        }

        processFixedPattern(currentSpinData.isWin);
    }

    // 出目の表示処理（固定出目）
    function processFixedPattern(isWin) {
        elEffect.textContent = "";

        // リーチ発生判定（当たり時は100%リーチ、ハズレ時は約15%でガセリーチ）
        const isReach = isWin || (Math.random() < 0.15);

        if (isWin) {
            // 【大当り】指定した揃い目を表示
            const winNum = (Math.random() < RATES.ST_RUSH_RATE || isST) ? 7 : 3;
            
            // 1. テンパイ表示
            elReel1.textContent = winNum;
            elReel2.textContent = "-"; // 中は一瞬ブランクに
            elReel3.textContent = winNum;
            elEffect.textContent = "🔥 リーチ！！ 🔥";

            // 2. 確定表示
            setTimeout(() => {
                elReel2.textContent = winNum;
                if (winNum === 7) {
                    elEffect.textContent = "【超大当り】ST「インパクトモード」突入！";
                    isST = true;
                    stRemains = RATES.ST_TURNS;
                } else {
                    elEffect.textContent = "【大当り】通常大当り";
                    isST = false;
                    stRemains = 0;
                }
                finishSpin();
            }, 1200);

        } else if (isReach) {
            // 【ハズレリーチ】決められたテンパイ図柄＋決められたハズレ中出目
            const reachNum = REACH_NUMBERS[Math.floor(Math.random() * REACH_NUMBERS.length)];
            const missCenter = (reachNum % 9) + 1; // 必ず1つずれた数字

            // 1. テンパイ表示（左・右が必ず同じ固定数字）
            elReel1.textContent = reachNum;
            elReel2.textContent = "-";
            elReel3.textContent = reachNum;
            elEffect.textContent = "🔥 リーチ！！ 🔥";

            // 2. ハズレ確定表示
            setTimeout(() => {
                elReel2.textContent = missCenter;
                elEffect.textContent = "ハズレ...";
                finishSpin();
            }, 1200);

        } else {
            // 【完全ハズレ】定規で決めたバラケ目リストから選択して即表示
            const pattern = FIXED_LOSE_PATTERNS[Math.floor(Math.random() * FIXED_LOSE_PATTERNS.length)];
            elReel1.textContent = pattern[0];
            elReel2.textContent = pattern[1];
            elReel3.textContent = pattern[2];
            elEffect.textContent = "";

            setTimeout(() => {
                finishSpin();
            }, 400); // 通常ハズレはスピーディーに次へ
        }
    }

    // 変動終了時のモード状態の切り替え・次の変動への遷移
    function finishSpin() {
        if (isST && stRemains <= 0) {
            isST = false;
            elEffect.textContent = "ST終了...";
        }

        if (isST) {
            elMode.textContent = "インパクトモード (ST)";
            elMode.className = "mode-st";
            elStCount.textContent = `ST残り: ${stRemains}回`;
        } else {
            elMode.textContent = "通常モード";
            elMode.className = "mode-normal";
            elStCount.textContent = "";
        }

        setTimeout(() => {
            startNextSpin();
        }, 600);
    }
</script>

</body>
</html>
