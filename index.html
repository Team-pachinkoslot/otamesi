<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>エヴァ15風 パチンコ SIM</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        #game-container {
            width: 400px;
            margin: 0 auto;
            background-color: #222;
            border: 4px solid #555;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 0 20px rgba(128, 0, 128, 0.5);
        }
        #status-bar {
            display: flex;
            justify-content: space-between;
            background: #333;
            padding: 8px;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 14px;
        }
        .mode-normal { color: #00ffff; }
        .mode-st { color: #ff00ff; animation: blink 0.5s infinite alternate; }
        @keyframes blink { from { opacity: 1; } to { opacity: 0.6; } }

        #screen {
            background: #000;
            border: 2px solid #888;
            height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        #reels {
            display: flex;
            gap: 15px;
            font-size: 64px;
            font-weight: bold;
            text-shadow: 0 0 10px #fff;
        }
        #effect-text {
            font-size: 20px;
            color: #ffcc00;
            height: 30px;
            margin-top: 15px;
            font-weight: bold;
        }
        #hold-container {
            margin: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .hold-ball {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #444;
            border: 1px solid #888;
        }
        .hold-blue { background: #0088ff; box-shadow: 0 0 5px #0088ff; }
        .hold-red { background: #ff0000; box-shadow: 0 0 8px #ff0000; }
        .hold-gold { background: #ffd700; box-shadow: 0 0 10px #ffd700; }

        #controls {
            margin-top: 15px;
        }
        button {
            padding: 12px 24px;
            font-size: 18px;
            background: linear-gradient(135deg, #8a2be2, #4b0082);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:active {
            transform: translateY(2px);
        }

        #version-info {
            position: fixed;
            right: 8px;
            bottom: 6px;
            color: #fff;
            font-size: 11px;
            font-weight: normal;
            z-index: 9999;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="status-bar">
        <span id="mode-display" class="mode-normal">通常モード</span>
        <span id="st-count"></span>
        <span>回転数: <span id="total-spins">0</span></span>
    </div>

    <div id="screen">
        <div id="reels">
            <span id="reel1">1</span>
            <span id="reel2">2</span>
            <span id="reel3">3</span>
        </div>
        <div id="effect-text"></div>
    </div>

    <div id="hold-container">
        <span>保留:</span>
        <div class="hold-ball" id="hold0"></div>
        <div class="hold-ball" id="hold1"></div>
        <div class="hold-ball" id="hold2"></div>
        <div class="hold-ball" id="hold3"></div>
    </div>

    <div id="controls">
        <button id="shoot-btn" onclick="addHold()">玉を打つ (ヘソ入賞)</button>
    </div>
</div>

<div id="version-info">Ver 1.0.0</div>

<script>
    const RATES = {
        NORMAL: 319.7,
        ST: 99.4,
        ST_RUSH_RATE: 0.70,
        ST_TURNS: 163
    };

    let totalSpins = 0;
    let isST = false;
    let stRemains = 0;
    let holds = [];
    let isSpinning = false;

    const elReel1 = document.getElementById('reel1');
    const elReel2 = document.getElementById('reel2');
    const elReel3 = document.getElementById('reel3');
    const elEffect = document.getElementById('effect-text');
    const elMode = document.getElementById('mode-display');
    const elStCount = document.getElementById('st-count');
    const elTotalSpins = document.getElementById('total-spins');

    function addHold() {
        if (holds.length >= 4) return;

        const currentRate = isST ? RATES.ST : RATES.NORMAL;
        const isWin = Math.random() < (1 / currentRate);

        holds.push({ isWin });
        updateHoldUI();

        if (!isSpinning) {
            startNextSpin();
        }
    }

    function updateHoldUI() {
        for (let i = 0; i < 4; i++) {
            const ball = document.getElementById(`hold${i}`);
            ball.className = 'hold-ball';

            if (i < holds.length) {
                if (holds[i].isWin && Math.random() < 0.8) {
                    ball.classList.add('hold-red');
                } else {
                    ball.classList.add('hold-blue');
                }
            }
        }
    }

    function startNextSpin() {
        if (holds.length === 0) {
            isSpinning = false;
            return;
        }

        isSpinning = true;

        const currentSpinData = holds.shift();
        updateHoldUI();

        totalSpins++;
        elTotalSpins.textContent = totalSpins;

        if (isST) {
            stRemains--;
            elStCount.textContent = `ST残り: ${stRemains}回`;
        }

        runSpinAnimation(currentSpinData.isWin);
    }

    function runSpinAnimation(isWin) {
        elEffect.textContent = "";

        let timer = 0;
        const spinDuration = isST ? 15 : 30;

        const interval = setInterval(() => {
            elReel1.textContent = Math.floor(Math.random() * 9) + 1;
            elReel2.textContent = Math.floor(Math.random() * 9) + 1;
            elReel3.textContent = Math.floor(Math.random() * 9) + 1;

            timer++;

            if (timer === Math.floor(spinDuration / 2)) {
                if (isWin || Math.random() < 0.15) {
                    const num = isWin ? (Math.random() < 0.5 ? 7 : 3) : 1;

                    elReel1.textContent = num;
                    elReel3.textContent = num;
                    elEffect.textContent = "リーチ！";
                }
            }

            if (timer >= spinDuration) {
                clearInterval(interval);
                finalizeSpin(isWin);
            }
        }, 50);
    }

    function finalizeSpin(isWin) {
        if (isWin) {
            const winNum =
                (Math.random() < RATES.ST_RUSH_RATE || isST) ? 7 : 2;

            elReel1.textContent = winNum;
            elReel2.textContent = winNum;
            elReel3.textContent = winNum;

            if (winNum === 7) {
                elEffect.textContent =
                    "【超大当り】ST「インパクトモード」突入！";

                isST = true;
                stRemains = RATES.ST_TURNS;
            } else {
                elEffect.textContent = "【大当り】通常大当り";

                isST = false;
                stRemains = 0;
            }
        } else {
            elReel1.textContent = 1;
            elReel2.textContent = 3;
            elReel3.textContent = 5;

            if (isST && stRemains <= 0) {
                isST = false;
                elEffect.textContent = "ST終了...";
            }
        }

        if (isST) {
            elMode.textContent = "インパクトモード (ST)";
            elMode.className = "mode-st";
            elStCount.textContent = `ST残り: ${stRemains}回`;
        } else {
            elMode.textContent = "通常モード";
            elMode.className = "mode-normal";
            elStCount.textContent = "";
        }

        setTimeout(() => {
            startNextSpin();
        }, 1000);
    }
</script>

</body>
</html>
