<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>パチンコ SIM Ver.2.1</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;

            background:
                radial-gradient(circle at center, #21102e 0%, #080808 55%, #000 100%);

            color: #fff;

            font-family:
                Arial,
                "Hiragino Kaku Gothic ProN",
                "Yu Gothic",
                sans-serif;

            text-align: center;

            min-height: 100vh;
        }

        /* ============================
           筐体
        ============================ */

        #machine {
            position: relative;

            width: min(760px, 100%);

            margin: 0 auto;

            padding: 14px;

            border: 6px solid #38284a;

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    #171717,
                    #262626 45%,
                    #0d0d0d
                );

            box-shadow:
                0 0 15px #8b00ff,
                0 0 40px rgba(128, 0, 255, 0.5),
                inset 0 0 20px rgba(255,255,255,0.1);
        }

        #machine::before {
            content: "";

            position: absolute;

            inset: 4px;

            pointer-events: none;

            border-radius: 20px;

            border: 2px solid #67ff3a;

            opacity: 0.55;

            animation: frameGlow 1.8s infinite alternate;
        }

        @keyframes frameGlow {
            from {
                box-shadow:
                    0 0 5px #6cff3c;
            }

            to {
                box-shadow:
                    0 0 20px #9cff45,
                    0 0 35px #7d00ff;
            }
        }

        /* ============================
           上部
        ============================ */

        #machine-title {
            padding: 10px 10px 5px;

            font-size: clamp(22px, 5vw, 38px);

            font-weight: 900;

            letter-spacing: 5px;

            color: #dcaaff;

            text-shadow:
                0 0 5px #8100ff,
                0 0 15px #8100ff,
                0 0 25px #68ff33;
        }

        #sub-title {
            margin-bottom: 10px;

            color: #888;

            font-size: 11px;

            letter-spacing: 4px;
        }

        /* ============================
           ステータス
        ============================ */

        #status-bar {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 4px;

            padding: 7px;

            background: #111;

            border: 1px solid #444;

            border-radius: 7px 7px 0 0;

            font-size: 13px;
        }

        .status-item {
            padding: 7px 4px;

            background:
                linear-gradient(#292929, #111);

            border: 1px solid #383838;
        }

        .status-label {
            display: block;

            color: #888;

            font-size: 9px;

            margin-bottom: 3px;
        }

        .mode-normal {
            color: #00f5ff;

            text-shadow:
                0 0 5px #00cfff;
        }

        .mode-st {
            color: #ff40ff;

            text-shadow:
                0 0 5px #ff00ff,
                0 0 10px #ff00ff;

            animation:
                modeBlink 0.5s infinite alternate;
        }

        @keyframes modeBlink {
            from {
                opacity: 1;
            }

            to {
                opacity: 0.65;
            }
        }

        /* ============================
           液晶
        ============================ */

        #screen {
            position: relative;

            min-height: 390px;

            overflow: hidden;

            border: 4px solid #777;

            border-radius: 3px;

            background:
                radial-gradient(
                    circle at center,
                    #201039 0%,
                    #090510 48%,
                    #000 100%
                );

            box-shadow:
                inset 0 0 40px #000,
                0 0 15px #000;
        }

        #screen::after {
            content: "";

            position: absolute;

            inset: 0;

            pointer-events: none;

            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(255,255,255,0.025),
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px,
                    transparent 3px
                );

            z-index: 15;
        }

        #screen.st-background {
            background:
                radial-gradient(
                    circle at center,
                    #4a006e,
                    #160026 60%,
                    #000
                );

            animation:
                stBackground 1s infinite alternate;
        }

        @keyframes stBackground {
            from {
                box-shadow:
                    inset 0 0 50px #62008a;
            }

            to {
                box-shadow:
                    inset 0 0 100px #bc00ff;
            }
        }

        /* ============================
           背景文字
        ============================ */

        #background-message {
            position: absolute;

            width: 100%;

            top: 20px;

            color:
                rgba(255,255,255,0.08);

            font-weight: bold;

            font-size: 44px;

            letter-spacing: 12px;

            pointer-events: none;
        }

        /* ============================
           リール
        ============================ */

        #reels-wrapper {
            position: absolute;

            top: 50%;

            left: 50%;

            transform:
                translate(-50%, -58%);

            width: 100%;
        }

        #reels {
            display: flex;

            justify-content: center;

            align-items: center;

            gap:
                clamp(7px, 3vw, 25px);
        }

        .reel {
            display: flex;

            justify-content: center;

            align-items: center;

            width:
                clamp(80px, 24vw, 150px);

            height:
                clamp(120px, 31vw, 180px);

            font-size:
                clamp(70px, 18vw, 130px);

            font-weight: 900;

            font-style: italic;

            border:
                2px solid rgba(255,255,255,0.25);

            border-radius: 8px;

            background:
                linear-gradient(
                    180deg,
                    rgba(255,255,255,0.06),
                    rgba(0,0,0,0.7)
                );

            color: #d7b8ff;

            text-shadow:
                4px 4px 0 #43005e,
                -2px -2px 0 #fff,
                0 0 10px #7c00ff,
                0 0 25px #7c00ff;

            box-shadow:
                inset 0 0 18px #000,
                0 0 10px rgba(180,0,255,0.2);

            transition:
                transform 0.15s,
                filter 0.15s;
        }

        .reel.spinning {
            filter:
                blur(3px);

            transform:
                scaleY(1.06);
        }

        .reel.stopped {
            animation:
                stopShock 0.16s ease-out;
        }

        @keyframes stopShock {
            0% {
                transform:
                    scale(1.3);
            }

            100% {
                transform:
                    scale(1);
            }
        }

        .reel.seven {
            color: #ff4040;

            text-shadow:
                4px 4px 0 #680000,
                -2px -2px 0 #fff,
                0 0 12px #ff0000,
                0 0 30px #ffd700;

            animation:
                sevenGlow 0.4s infinite alternate;
        }

        @keyframes sevenGlow {
            from {
                transform:
                    scale(1);
            }

            to {
                transform:
                    scale(1.08);
            }
        }

        /* ============================
           演出文字
        ============================ */

        #effect-text {
            position: absolute;

            left: 0;

            right: 0;

            bottom: 35px;

            min-height: 38px;

            z-index: 20;

            font-size:
                clamp(17px, 4vw, 27px);

            font-weight: 900;

            color: #ffea00;

            text-shadow:
                0 0 5px #ff0000,
                0 0 12px #ff0000;
        }

        /* ============================
           巨大表示
        ============================ */

        #big-overlay {
            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: 30;

            pointer-events: none;

            opacity: 0;

            font-size:
                clamp(50px, 13vw, 100px);

            font-weight: 900;

            font-style: italic;

            color: white;

            text-shadow:
                4px 4px 0 #000,
                0 0 10px #ff0000,
                0 0 30px #ff0000;
        }

        #big-overlay.show {
            animation:
                overlayAnimation 0.9s ease-out;
        }

        @keyframes overlayAnimation {
            0% {
                opacity: 0;

                transform:
                    scale(3);
            }

            25% {
                opacity: 1;
            }

            65% {
                transform:
                    scale(0.9);
            }

            100% {
                opacity: 0;

                transform:
                    scale(1);
            }
        }

        /* ============================
           フラッシュ
        ============================ */

        #flash {
            position: absolute;

            inset: 0;

            z-index: 50;

            pointer-events: none;

            opacity: 0;
        }

        #flash.white {
            animation:
                whiteFlash 0.4s;
        }

        #flash.red {
            animation:
                redFlash 0.6s;
        }

        #flash.gold {
            animation:
                goldFlash 0.7s;
        }

        @keyframes whiteFlash {
            0% {
                background: white;

                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        @keyframes redFlash {
            0%,
            100% {
                background: red;

                opacity: 0;
            }

            50% {
                opacity: 0.55;
            }
        }

        @keyframes goldFlash {
            0%,
            100% {
                background: #ffd700;

                opacity: 0;
            }

            50% {
                opacity: 0.7;
            }
        }

        /* ============================
           PUSH
        ============================ */

        #push-overlay {
            position: absolute;

            inset: 0;

            z-index: 40;

            display: none;

            align-items: center;

            justify-content: center;
        }

        #push-overlay.visible {
            display: flex;
        }

        #push-button-screen {
            width: 110px;

            height: 110px;

            border-radius: 50%;

            border: 5px solid white;

            background:
                radial-gradient(
                    circle,
                    white 0%,
                    #ccc 30%,
                    #7400ff 35%,
                    #1a002e 100%
                );

            color: white;

            font-size: 22px;

            font-weight: bold;

            text-shadow:
                0 0 5px black;

            box-shadow:
                0 0 20px white,
                0 0 40px #7d00ff;

            animation:
                pushPulse 0.55s infinite alternate;

            cursor: pointer;
        }

        @keyframes pushPulse {
            from {
                transform:
                    scale(0.9);
            }

            to {
                transform:
                    scale(1.12);
            }
        }

        /* ============================
           大当り
        ============================ */

        #screen.jackpot {
            animation:
                jackpotScreen 0.3s infinite alternate;
        }

        @keyframes jackpotScreen {
            from {
                box-shadow:
                    inset 0 0 40px red;
            }

            to {
                box-shadow:
                    inset 0 0 100px gold;
            }
        }

        /* ============================
           保留
        ============================ */

        #hold-area {
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 12px;

            padding: 12px;

            background:
                linear-gradient(#171717, #0a0a0a);

            border-left:
                1px solid #444;

            border-right:
                1px solid #444;

            border-bottom:
                1px solid #444;
        }

        #hold-title {
            margin-right: 8px;

            color: #ccc;

            font-weight: bold;

            font-size: 14px;
        }

        .hold-ball {
            width: 30px;

            height: 30px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #777,
                    #252525 60%,
                    #050505
                );

            border: 2px solid #888;

            box-shadow:
                inset 0 0 5px black;

            transition:
                all 0.3s;
        }

        .hold-blue {
            background:
                radial-gradient(
                    circle at 35% 30%,
                    white,
                    #00bfff 30%,
                    #005ab5 75%
                );

            box-shadow:
                0 0 12px #00aaff;
        }

        .hold-green {
            background:
                radial-gradient(
                    circle at 35% 30%,
                    white,
                    #7dff3b 30%,
                    #167500 75%
                );

            box-shadow:
                0 0 12px #60ff22;
        }

        .hold-red {
            background:
                radial-gradient(
                    circle at 35% 30%,
                    white,
                    #ff3737 30%,
                    #900000 75%
                );

            box-shadow:
                0 0 17px red;
        }

        .hold-gold {
            background:
                radial-gradient(
                    circle at 35% 30%,
                    white,
                    #fff36b 25%,
                    #ffd000 45%,
                    #9b6800 80%
                );

            box-shadow:
                0 0 20px gold;

            animation:
                goldHold 0.35s infinite alternate;
        }

        @keyframes goldHold {
            from {
                transform:
                    scale(1);
            }

            to {
                transform:
                    scale(1.15);
            }
        }

        /* ============================
           操作部
        ============================ */

        #control-panel {
            padding: 16px;

            background:
                linear-gradient(
                    150deg,
                    #292929,
                    #0e0e0e
                );

            border-radius:
                0 0 15px 15px;
        }

        #main-controls {
            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 10px;
        }

        button {
            border: none;

            color: white;

            cursor: pointer;

            font-weight: bold;

            transition:
                transform 0.1s,
                filter 0.2s;
        }

        button:active {
            transform:
                translateY(3px)
                scale(0.97);
        }

        #shoot-btn {
            width: 190px;

            height: 62px;

            border-radius: 32px;

            font-size: 17px;

            border:
                3px solid #b67aff;

            background:
                linear-gradient(
                    145deg,
                    #7e23d4,
                    #2e004f
                );

            box-shadow:
                0 0 15px #7100d8,
                inset 0 0 10px #b97bff;
        }

        .small-btn {
            min-width: 110px;

            padding: 12px;

            border-radius: 7px;

            background:
                linear-gradient(
                    #444,
                    #1c1c1c
                );

            border:
                1px solid #666;
        }

        .small-btn.active {
            background:
                linear-gradient(
                    #9c1aff,
                    #430071
                );

            box-shadow:
                0 0 10px #9c1aff;
        }

        /* ============================
           ログ
        ============================ */

        #log-panel {
            margin-top: 12px;

            padding: 8px;

            height: 115px;

            overflow-y: auto;

            text-align: left;

            background: #050505;

            border:
                1px solid #333;

            font-family: monospace;

            font-size: 11px;

            color: #aaa;
        }

        .log-win {
            color: #ffd700;

            font-weight: bold;
        }

        .log-reach {
            color: #ff6969;
        }

        .log-info {
            color: #6bdcff;
        }

        /* ============================
           バージョン
        ============================ */

        #version-display {
            position: fixed;

            right: 8px;

            bottom: 8px;

            z-index: 100;

            padding: 3px 7px;

            font-size: 10px;

            font-family: monospace;

            color: #aaa;

            background:
                rgba(10,10,10,0.9);

            border:
                1px solid #555;

            border-radius: 3px;

            cursor: default;

            user-select: none;
        }

        /* ============================
           隠し設定画面
        ============================ */

        #secret-settings {
            position: fixed;

            inset: 0;

            display: none;

            align-items: center;

            justify-content: center;

            z-index: 9999;

            background:
                rgba(0,0,0,0.88);
        }

        #secret-settings.visible {
            display: flex;
        }

        #secret-settings-panel {
            width: 390px;

            max-width:
                calc(100% - 30px);

            padding: 20px;

            background:
                linear-gradient(
                    145deg,
                    #202020,
                    #101010
                );

            border:
                2px solid #8b00ff;

            border-radius: 12px;

            box-shadow:
                0 0 25px #7b00ff;

            text-align: left;
        }

        #secret-settings-panel h2 {
            margin:
                0 0 5px;

            color: #d9a5ff;

            text-align: center;
        }

        #secret-settings-description {
            margin-bottom: 20px;

            color: #777;

            text-align: center;

            font-size: 11px;
        }

        .secret-setting-row {
            margin-bottom: 15px;
        }

        .secret-setting-row label {
            display: block;

            margin-bottom: 5px;

            color: #ccc;

            font-size: 13px;
        }

        .secret-setting-row input {
            width: 100%;

            padding: 9px;

            color: white;

            background: #080808;

            border:
                1px solid #555;

            border-radius: 4px;

            font-size: 16px;
        }

        #secret-settings-buttons {
            display: flex;

            gap: 8px;

            margin-top: 20px;
        }

        #secret-settings-buttons button {
            flex: 1;

            padding: 10px;

            border-radius: 5px;

            font-size: 13px;
        }

        #secret-save {
            background: #6500a8;
        }

        #secret-reset {
            background: #763000;
        }

        #secret-close {
            background: #333;
        }

        #secret-current {
            margin-top: 15px;

            padding: 10px;

            background: #080808;

            border:
                1px solid #333;

            color: #aaa;

            font-family: monospace;

            font-size: 11px;

            line-height: 1.7;
        }

        /* ============================
           スマートフォン
        ============================ */

        @media(max-width: 600px) {

            body {
                padding: 4px;
            }

            #machine {
                border-width: 3px;

                padding: 7px;
            }

            #screen {
                min-height: 300px;
            }

            #status-bar {
                font-size: 11px;
            }

            .status-label {
                font-size: 8px;
            }

            .hold-ball {
                width: 25px;

                height: 25px;
            }

            #control-panel {
                padding: 10px;
            }
        }
    </style>
</head>

<body>


<div id="machine">

    <div id="machine-title">
        IMPACT PACHINKO
    </div>

    <div id="sub-title">
        SIMULATION SYSTEM
    </div>


    <!-- ステータス -->

    <div id="status-bar">

        <div class="status-item">

            <span class="status-label">
                MODE
            </span>

            <span
                id="mode-display"
                class="mode-normal"
            >
                通常
            </span>

        </div>


        <div class="status-item">

            <span class="status-label">
                ST
            </span>

            <span id="st-count">
                ---
            </span>

        </div>


        <div class="status-item">

            <span class="status-label">
                SPIN
            </span>

            <span id="total-spins">
                0
            </span>

        </div>


        <div class="status-item">

            <span class="status-label">
                BONUS
            </span>

            <span id="hit-count">
                0
            </span>

        </div>

    </div>


    <!-- 液晶 -->

    <div id="screen">

        <div id="background-message">
            IMPACT
        </div>


        <div id="reels-wrapper">

            <div id="reels">

                <div
                    id="reel1"
                    class="reel"
                >
                    1
                </div>

                <div
                    id="reel2"
                    class="reel"
                >
                    2
                </div>

                <div
                    id="reel3"
                    class="reel"
                >
                    3
                </div>

            </div>

        </div>


        <div id="effect-text">
            玉を打ってください
        </div>


        <div id="big-overlay">
        </div>


        <div id="flash">
        </div>


        <div id="push-overlay">

            <button id="push-button-screen">
                PUSH
            </button>

        </div>

    </div>


    <!-- 保留 -->

    <div id="hold-area">

        <span id="hold-title">
            保留
        </span>

        <div
            class="hold-ball"
            id="hold0"
        ></div>

        <div
            class="hold-ball"
            id="hold1"
        ></div>

        <div
            class="hold-ball"
            id="hold2"
        ></div>

        <div
            class="hold-ball"
            id="hold3"
        ></div>

    </div>


    <!-- 操作 -->

    <div id="control-panel">

        <div id="main-controls">

            <button
                id="shoot-btn"
                onclick="addHold()"
            >
                玉を打つ
            </button>


            <button
                id="auto-btn"
                class="small-btn"
                onclick="toggleAuto()"
            >
                AUTO OFF
            </button>


            <button
                id="sound-btn"
                class="small-btn active"
                onclick="toggleSound()"
            >
                SOUND ON
            </button>

        </div>


        <div id="log-panel">
        </div>

    </div>

</div>


<!-- バージョン -->

<div id="version-display">
    Ver. 2.1
</div>


<!-- ======================================
     隠し確率設定
====================================== -->

<div id="secret-settings">

    <div id="secret-settings-panel">

        <h2>
            SYSTEM SETTINGS
        </h2>

        <div id="secret-settings-description">
            Simulation Probability Configuration
        </div>


        <div class="secret-setting-row">

            <label>
                通常時 大当り確率（1 / ○○）
            </label>

            <input
                type="number"
                id="setting-normal"
                step="0.1"
                min="1"
            >

        </div>


        <div class="secret-setting-row">

            <label>
                ST中 大当り確率（1 / ○○）
            </label>

            <input
                type="number"
                id="setting-st"
                step="0.1"
                min="1"
            >

        </div>


        <div class="secret-setting-row">

            <label>
                ST突入率（%）
            </label>

            <input
                type="number"
                id="setting-rush"
                step="0.1"
                min="0"
                max="100"
            >

        </div>


        <div class="secret-setting-row">

            <label>
                ST回数
            </label>

            <input
                type="number"
                id="setting-turns"
                step="1"
                min="1"
            >

        </div>


        <div id="secret-settings-buttons">

            <button id="secret-save">
                保存
            </button>

            <button id="secret-reset">
                初期値
            </button>

            <button id="secret-close">
                閉じる
            </button>

        </div>


        <div id="secret-current">
        </div>

    </div>

</div>



<script>

/* ========================================
   初期確率
======================================== */

const DEFAULT_RATES = {

    NORMAL: 319.7,

    ST: 99.4,

    ST_RUSH_RATE: 0.70,

    ST_TURNS: 163

};


/* ========================================
   保存済み確率を読み込む
======================================== */

function loadRateSettings() {

    try {

        const savedText =
            localStorage.getItem(
                "pachinkoRateSettings"
            );

        if (!savedText) {

            return {
                ...DEFAULT_RATES
            };

        }


        const saved =
            JSON.parse(
                savedText
            );


        return {

            NORMAL:
                Number(saved.NORMAL) > 0
                    ? Number(saved.NORMAL)
                    : DEFAULT_RATES.NORMAL,

            ST:
                Number(saved.ST) > 0
                    ? Number(saved.ST)
                    : DEFAULT_RATES.ST,

            ST_RUSH_RATE:
                Number(saved.ST_RUSH_RATE) >= 0 &&
                Number(saved.ST_RUSH_RATE) <= 1

                    ? Number(saved.ST_RUSH_RATE)

                    : DEFAULT_RATES.ST_RUSH_RATE,

            ST_TURNS:
                Number(saved.ST_TURNS) > 0
                    ? Math.floor(
                        Number(saved.ST_TURNS)
                    )
                    : DEFAULT_RATES.ST_TURNS

        };

    }
    catch (error) {

        return {
            ...DEFAULT_RATES
        };

    }

}

        }
    );

function addLog(
    message,
    type = ""
) {

    const now =
        new Date();


    const time =
        now.toLocaleTimeString(
            "ja-JP",
            {
                hour12: false
            }
        );


    const line =
        document.createElement(

/* ========================================
   簡易効果音
======================================== */

function tone(
    frequency = 440,
    duration = 0.1,
    volume = 0.05
) {

    if (!soundEnabled) {

        return;

    }


    try {

        const AudioContextClass =
            window.AudioContext ||
            window.webkitAudioContext;


        const context =
            new AudioContextClass();


        const oscillator =
            context.createOscillator();


        const gain =
            context.createGain();


        oscillator.type =
            "square";


        oscillator.frequency.value =
            frequency;


        gain.gain.value =
            volume;


        oscillator.connect(
            gain
        );


        gain.connect(
            context.destination
        );


        oscillator.start();


        gain.gain.exponentialRampToValueAtTime(
            0.001,
            context.currentTime + duration
        );


        oscillator.stop(
            context.currentTime + duration
        );

    }
    catch (error) {

        /* 音声非対応でも継続 */

    }

}

/* ========================================
   保留色
======================================== */

function determineHoldType(
    isWin
) {

    const r =
        Math.random();


    if (isWin) {

        if (
            r < 0.18
        ) {

            return "gold";

        }


        if (
            r < 0.62
        ) {

            return "red";

        }


        if (
            r < 0.85
        ) {

            return "green";

        }


        return "blue";

    }


    if (
        r < 0.003
    ) {

        return "gold";

    }


    if (
        r < 0.025
    ) {

        return "red";

    }


    if (
        r < 0.15
    ) {

        return "green";

    }


    return "blue";

}


/* ========================================
   入賞
======================================== */

function addHold() {

    if (
        holds.length >= 4
    ) {

        return;

    }


    const currentRate =
        isST
            ? RATES.ST
            : RATES.NORMAL;


    /* ================================
       大当り抽選
    ================================ */

    const randomValue =
        Math.random();


    const winBorder =
        1 / currentRate;


    const isWin =
        randomValue < winBorder;


    const holdType =
        determineHoldType(
            isWin
        );


    holds.push({

        isWin,

        holdType

    });


    addLog(
        `入賞 / ${isST ? "ST" : "通常"} / 1/${currentRate}`
    );


    updateHoldUI();


    if (!isSpinning) {

        startNextSpin();

    }

}


/* ========================================
   保留UI
======================================== */

function updateHoldUI() {

    for (
        let i = 0;
        i < 4;
        i++
    ) {

        const ball =
            document.getElementById(
                `hold${i}`
            );


        ball.className =
            "hold-ball";


        if (
            i < holds.length
        ) {

            const hold =
                holds[i];


            ball.classList.add(
                `hold-${hold.holdType}`
            );

        }

    }

}


/* ========================================
   変動開始
======================================== */

async function startNextSpin() {

    if (
        holds.length === 0
    ) {

        isSpinning = false;


        effectText.textContent =
            "玉を打ってください";


        return;

    }


    isSpinning = true;


    const spinData =
        holds.shift();


    updateHoldUI();


    totalSpins++;


    totalSpinsEl.textContent =
        totalSpins;


    if (isST) {

        stRemains--;


        stCount.textContent =
            `${stRemains}回`;

    }


    addLog(
        `変動 #${totalSpins} 開始`,
        "log-info"
    );


    await runSpinAnimation(
        spinData
    );

}


/* ========================================
   ランダム図柄
======================================== */

function randomNumber() {

    return (
        Math.floor(
            Math.random() * 9
        ) + 1
    );

}


/* ========================================
   リール開始
======================================== */

function startReelSpin(
    reel
) {

    reel.classList.add(
        "spinning"
    );


    return setInterval(
        () => {

            reel.textContent =
                randomNumber();

        },
        55
    );

}


/* ========================================
   リール停止
======================================== */

function stopReel(
    reel,
    number,
    interval
) {

    clearInterval(
        interval
    );


    reel.textContent =
        number;


    reel.classList.remove(
        "spinning"
    );


    reel.classList.remove(
        "stopped"
    );


    void reel.offsetWidth;


    reel.classList.add(
        "stopped"
    );


    tone(
        180,
        0.06,
        0.025
    );

}

/* ========================================
   変動演出
======================================== */

async function runSpinAnimation(
    spinData
) {

    const isWin =
        spinData.isWin;


    effectText.textContent =
        "変動開始";


    screen.classList.remove(
        "jackpot"
    );


    [
        reel1,
        reel2,
        reel3
    ].forEach(
        reel => {

            reel.classList.remove(
                "seven"
            );

        }
    );


    tone(
        220,
        0.06
    );


    /*
       当たりは必ずリーチ
       ハズレは15%でリーチ
    */

    const isReach =
        isWin ||
        Math.random() < 0.15;


    let reachNum;


    if (isWin) {

        /*
           ST中は7図柄

           通常時は
           設定したST突入率によって
           7図柄を決定
        */

        if (
            isST ||
            Math.random() <
                RATES.ST_RUSH_RATE
        ) {

            reachNum = 7;

        }
        else {

            do {

                reachNum =
                    randomNumber();

            }
            while (
                reachNum === 7
            );

        }

    }
    else {

        reachNum =
            randomNumber();

    }


    const interval1 =
        startReelSpin(
            reel1
        );


    const interval2 =
        startReelSpin(
            reel2
        );


    const interval3 =
        startReelSpin(
            reel3
        );


    const speed =
        isST
            ? 0.55
            : 1;


    await sleep(
        750 * speed
    );


    /* 左停止 */

    const leftNum =
        isReach
            ? reachNum
            : randomNumber();


    stopReel(
        reel1,
        leftNum,
        interval1
    );


    await sleep(
        500 * speed
    );


    /* 右停止 */

    let rightNum;


    if (isReach) {

        rightNum =
            reachNum;

    }
    else {

        do {

            rightNum =
                randomNumber();

        }
        while (
            rightNum === leftNum
        );

    }


    stopReel(
        reel3,
        rightNum,
        interval3
    );


    /* ================================
       非リーチ
    ================================ */

    if (!isReach) {

        await sleep(
            450 * speed
        );


        let center;


        do {

            center =
                randomNumber();

        }
        while (
            center === leftNum &&
            leftNum === rightNum
        );


        stopReel(
            reel2,
            center,
            interval2
        );


        effectText.textContent =
            "";


        await sleep(
            650 * speed
        );


        await finalizeSpin(
            false,
            false,
            reachNum
        );


        return;

    }


    /* ================================
       リーチ
    ================================ */

    addLog(
        `${reachNum}図柄 リーチ成立`,
        "log-reach"
    );


    effectText.textContent =
        "リーチ！！";


    showOverlay(
        "REACH"
    );


    screenFlash(
        "red"
    );


    tone(
        350,
        0.18,
        0.06
    );


    await sleep(
        800 * speed
    );


    /* ================================
       激熱演出
    ================================ */

    const hotChance =
        isWin
            ? 0.72
            : 0.08;


    const isHot =
        Math.random() <
        hotChance;


    if (isHot) {

        addLog(
            "強演出発生",
            "log-reach"
        );


        effectText.textContent =
            "激 熱";


        showOverlay(
            "激熱"
        );


        screenFlash(
            "gold"
        );


        tone(
            700,
            0.25,
            0.07
        );


        await sleep(
            900 * speed
        );

    }


    /* ================================
       PUSH
    ================================ */

    effectText.textContent =
        "ボタンを押せ！";


    await showPush();


    /* ================================
       最終煽り
    ================================ */

    effectText.textContent =
        "決まるか！？";


    for (
        let i = 0;
        i < 6;
        i++
    ) {

        screenFlash(
            i % 2 === 0
                ? "red"
                : "white"
        );


        tone(
            300 + i * 60,
            0.05,
            0.03
        );


        await sleep(
            170
        );

    }


    /* ================================
       中央停止
    ================================ */

    if (isWin) {

        stopReel(
            reel2,
            reachNum,
            interval2
        );

    }
    else {

        let missCenter =
            reachNum +
            (
                Math.random() < 0.5
                    ? 1
                    : -1
            );


        if (
            missCenter < 1
        ) {

            missCenter = 9;

        }


        if (
            missCenter > 9
        ) {

            missCenter = 1;

        }


        stopReel(
            reel2,
            missCenter,
            interval2
        );

    }


    await sleep(
        350
    );


    await finalizeSpin(
        isWin,
        true,
        reachNum
    );

}


/* ========================================
   結果
======================================== */

async function finalizeSpin(
    isWin,
    isReach,
    reachNum
) {

    if (isWin) {

        hitCount++;


        hitCountEl.textContent =
            hitCount;


        reel1.textContent =
            reachNum;


        reel2.textContent =
            reachNum;


        reel3.textContent =
            reachNum;


        screen.classList.add(
            "jackpot"
        );


        addLog(
            `大当り！ ${reachNum}${reachNum}${reachNum}`,
            "log-win"
        );


        showOverlay(
            "大当り"
        );


        screenFlash(
            "white"
        );


        tone(
            800,
            0.15,
            0.08
        );


        await sleep(
            250
        );


        tone(
            1000,
            0.15,
            0.08
        );


        await sleep(
            250
        );


        tone(
            1200,
            0.4,
            0.08
        );


        /* ================================
           ST突入
        ================================ */

        if (
            reachNum === 7
        ) {

            [
                reel1,
                reel2,
                reel3
            ].forEach(
                reel => {

                    reel.classList.add(
                        "seven"
                    );

                }
            );


            effectText.textContent =
                "777 SPECIAL BONUS";


            await sleep(
                800
            );


            showOverlay(
                "777"
            );


            screenFlash(
                "gold"
            );


            await sleep(
                900
            );


            isST = true;


            stRemains =
                RATES.ST_TURNS;


            rushCount++;


            screen.classList.add(
                "st-background"
            );


            addLog(
                `IMPACT MODE 突入 / ${RATES.ST_TURNS}回`,
                "log-win"
            );


            effectText.textContent =
                "IMPACT MODE 突入";


            showOverlay(
                "IMPACT"
            );

        }
        else {

            effectText.textContent =
                "BONUS";


            isST = false;


            stRemains = 0;


            screen.classList.remove(
                "st-background"
            );


            addLog(
                "通常大当り",
                "log-win"
            );

        }

    }
    else {

        if (isReach) {

            effectText.textContent =
                "ハズレ…";


            addLog(
                "リーチ ハズレ"
            );


            tone(
                130,
                0.25,
                0.025
            );

        }
        else {

            effectText.textContent =
                "";

        }


        /* ================================
           ST終了
        ================================ */

        if (
            isST &&
            stRemains <= 0
        ) {

            isST = false;


            stRemains = 0;


            screen.classList.remove(
                "st-background"
            );


            effectText.textContent =
                "IMPACT MODE 終了";


            showOverlay(
                "ST END"
            );


            addLog(
                "ST終了",
                "log-info"
            );


            await sleep(
                1000
            );

        }

    }


    updateModeUI();


    await sleep(
        isST
            ? 350
            : 850
    );


    screen.classList.remove(
        "jackpot"
    );


    startNextSpin();

}

}

    .getElementById(
        "secret-save"

    .addEventListener(
        "click",

                Number(
                    settingNormal.value

                Number(
                    settingST.value
                );


            const rush =
                Number(
                    settingRush.value
                );


            const turns =
                Number(
                    settingTurns.value
                );


            if (
                !Number.isFinite(normal) ||
                !Number.isFinite(st) ||
                !Number.isFinite(rush) ||
                !Number.isFinite(turns) ||
                normal < 1 ||
                st < 1 ||
                rush < 0 ||
                rush > 100 ||
                turns < 1
            ) {

                alert(
                    "設定値を確認してください。"
                );


                return;

            }


            RATES.NORMAL =
                normal;


            RATES.ST =
                st;


            RATES.ST_RUSH_RATE =
                rush / 100;


            RATES.ST_TURNS =
                Math.floor(
                    turns
                );


            localStorage.setItem(
                "pachinkoRateSettings",
                JSON.stringify(
                    RATES
                )
            );


            updateSecretSettingsDisplay();


            addLog(
                `確率設定変更 / 通常 1/${RATES.NORMAL} / ST 1/${RATES.ST} / ST突入率 ${(RATES.ST_RUSH_RATE * 100).toFixed(1)}%`,

/* ========================================
   背景クリックで閉じる
======================================== */

secretSettings.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            secretSettings
        ) {

            closeSecretSettings();

        }

    }
);


/* ========================================
   起動ログ
======================================== */

addLog(
    "PACHINKO SIM Ver.2.1 起動",
    "log-info"
);


addLog(
    `通常確率 1/${RATES.NORMAL}`
);


addLog(
    `ST確率 1/${RATES.ST} / ${RATES.ST_TURNS}回`
);


addLog(
    `ST突入率 ${(RATES.ST_RUSH_RATE * 100).toFixed(1)}%`
);

</script>
