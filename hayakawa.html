<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>パチンコ SIM Ver.2.0</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background:
                radial-gradient(circle at center, #21102e 0%, #080808 55%, #000 100%);
            color: #fff;
            font-family:
                Arial,
                "Hiragino Kaku Gothic ProN",
                "Yu Gothic",
                sans-serif;

            text-align: center;
            min-height: 100vh;
        }

        /* ============================
           筐体
        ============================ */

        #machine {
            position: relative;
            width: min(760px, 100%);
            margin: 0 auto;

            padding: 14px;

            border: 6px solid #38284a;
            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    #171717,
                    #262626 45%,
                    #0d0d0d
                );

            box-shadow:
                0 0 15px #8b00ff,
                0 0 40px rgba(128, 0, 255, 0.5),
                inset 0 0 20px rgba(255,255,255,0.1);
        }

        #machine::before {
            content: "";
            position: absolute;
            inset: 4px;
            pointer-events: none;

            border-radius: 20px;
            border: 2px solid #67ff3a;

            opacity: 0.55;

            animation: frameGlow 1.8s infinite alternate;
        }

        @keyframes frameGlow {
            from {
                box-shadow:
                    0 0 5px #6cff3c;
            }

            to {
                box-shadow:
                    0 0 20px #9cff45,
                    0 0 35px #7d00ff;
            }
        }

        /* ============================
           上部
        ============================ */

        #machine-title {
            padding: 10px 10px 5px;

            font-size: clamp(22px, 5vw, 38px);
            font-weight: 900;
            letter-spacing: 5px;

            color: #dcaaff;

            text-shadow:
                0 0 5px #8100ff,
                0 0 15px #8100ff,
                0 0 25px #68ff33;
        }

        #sub-title {
            margin-bottom: 10px;

            color: #888;
            font-size: 11px;
            letter-spacing: 4px;
        }

        /* ============================
           ステータス
        ============================ */

        #status-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;

            padding: 7px;

            background: #111;
            border: 1px solid #444;
            border-radius: 7px 7px 0 0;

            font-size: 13px;
        }

        .status-item {
            padding: 7px 4px;
            background: linear-gradient(#292929, #111);
            border: 1px solid #383838;
        }

        .status-label {
            display: block;

            color: #888;
            font-size: 9px;
            margin-bottom: 3px;
        }

        .mode-normal {
            color: #00f5ff;
            text-shadow: 0 0 5px #00cfff;
        }

        .mode-st {
            color: #ff40ff;

            text-shadow:
                0 0 5px #ff00ff,
                0 0 10px #ff00ff;

            animation: modeBlink 0.5s infinite alternate;
        }

        @keyframes modeBlink {
            from {
                opacity: 1;
            }

            to {
                opacity: 0.65;
            }
        }

        /* ============================
           液晶
        ============================ */

        #screen {
            position: relative;

            min-height: 390px;

            overflow: hidden;

            border:
                4px solid #777;

            border-radius: 3px;

            background:
                radial-gradient(
                    circle at center,
                    #201039 0%,
                    #090510 48%,
                    #000 100%
                );

            box-shadow:
                inset 0 0 40px #000,
                0 0 15px #000;
        }

        #screen::after {
            content: "";

            position: absolute;
            inset: 0;

            pointer-events: none;

            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(255,255,255,0.025),
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px,
                    transparent 3px
                );

            z-index: 15;
        }

        /* ST背景 */

        #screen.st-background {
            background:
                radial-gradient(
                    circle at center,
                    #4a006e,
                    #160026 60%,
                    #000
                );

            animation: stBackground 1s infinite alternate;
        }

        @keyframes stBackground {
            from {
                box-shadow:
                    inset 0 0 50px #62008a;
            }

            to {
                box-shadow:
                    inset 0 0 100px #bc00ff;
            }
        }

        /* ============================
           背景文字
        ============================ */

        #background-message {
            position: absolute;

            width: 100%;

            top: 20px;

            color: rgba(255,255,255,0.08);

            font-weight: bold;
            font-size: 44px;
            letter-spacing: 12px;

            pointer-events: none;
        }

        /* ============================
           リール
        ============================ */

        #reels-wrapper {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -58%);

            width: 100%;
        }

        #reels {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: clamp(7px, 3vw, 25px);
        }

        .reel {
            display: flex;

            justify-content: center;
            align-items: center;

            width: clamp(80px, 24vw, 150px);
            height: clamp(120px, 31vw, 180px);

            font-size: clamp(70px, 18vw, 130px);
            font-weight: 900;
            font-style: italic;

            border:
                2px solid rgba(255,255,255,0.25);

            border-radius: 8px;

            background:
                linear-gradient(
                    180deg,
                    rgba(255,255,255,0.06),
                    rgba(0,0,0,0.7)
                );

            color: #d7b8ff;

            text-shadow:
                4px 4px 0 #43005e,
                -2px -2px 0 #fff,
                0 0 10px #7c00ff,
                0 0 25px #7c00ff;

            box-shadow:
                inset 0 0 18px #000,
                0 0 10px rgba(180,0,255,0.2);

            transition:
                transform 0.15s,
                filter 0.15s;
        }

        .reel.spinning {
            filter: blur(3px);
            transform: scaleY(1.06);
        }

        .reel.stopped {
            animation:
                stopShock 0.16s ease-out;
        }

        @keyframes stopShock {
            0% {
                transform:
                    scale(1.3);
            }

            100% {
                transform:
                    scale(1);
            }
        }

        .reel.seven {
            color: #ff4040;

            text-shadow:
                4px 4px 0 #680000,
                -2px -2px 0 #fff,
                0 0 12px #ff0000,
                0 0 30px #ffd700;

            animation:
                sevenGlow 0.4s infinite alternate;
        }

        @keyframes sevenGlow {
            from {
                transform:
                    scale(1);
            }

            to {
                transform:
                    scale(1.08);
            }
        }

        /* ============================
           演出文字
        ============================ */

        #effect-text {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 35px;

            min-height: 38px;

            z-index: 20;

            font-size:
                clamp(17px, 4vw, 27px);

            font-weight: 900;

            color: #ffea00;

            text-shadow:
                0 0 5px #ff0000,
                0 0 12px #ff0000;
        }

        /* ============================
           巨大オーバーレイ
        ============================ */

        #big-overlay {
            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            z-index: 30;

            pointer-events: none;

            opacity: 0;

            font-size:
                clamp(50px, 13vw, 100px);

            font-weight: 900;

            font-style: italic;

            color: white;

            text-shadow:
                4px 4px 0 #000,
                0 0 10px #ff0000,
                0 0 30px #ff0000;
        }

        #big-overlay.show {
            animation:
                overlayAnimation 0.9s ease-out;
        }

        @keyframes overlayAnimation {
            0% {
                opacity: 0;
                transform:
                    scale(3);
            }

            25% {
                opacity: 1;
            }

            65% {
                transform:
                    scale(0.9);
            }

            100% {
                opacity: 0;
                transform:
                    scale(1);
            }
        }

        /* ============================
           フラッシュ
        ============================ */

        #flash {
            position: absolute;

            inset: 0;

            z-index: 50;

            pointer-events: none;

            opacity: 0;
        }

        #flash.white {
            animation:
                whiteFlash 0.4s;
        }

        #flash.red {
            animation:
                redFlash 0.6s;
        }

        #flash.gold {
            animation:
                goldFlash 0.7s;
        }

        @keyframes whiteFlash {
            0% {
                background: white;
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        @keyframes redFlash {
            0%,
            100% {
                background: red;
                opacity: 0;
            }

            50% {
                opacity: 0.55;
            }
        }

        @keyframes goldFlash {
            0%,
            100% {
                background: #ffd700;
                opacity: 0;
            }

            50% {
                opacity: 0.7;
            }
        }

        /* ============================
           PUSH
        ============================ */

        #push-overlay {
            position: absolute;

            inset: 0;

            z-index: 40;

            display: none;

            align-items: center;
            justify-content: center;
        }

        #push-overlay.visible {
            display: flex;
        }

        #push-button-screen {
            width: 110px;
            height: 110px;

            border-radius: 50%;

            border: 5px solid white;

            background:
                radial-gradient(
                    circle,
                    white 0%,
                    #ccc 30%,
                    #7400ff 35%,
                    #1a002e 100%
                );

            color: white;

            font-size: 22px;
            font-weight: bold;

            text-shadow:
                0 0 5px black;

            box-shadow:
                0 0 20px white,
                0 0 40px #7d00ff;

            animation:
                pushPulse 0.55s infinite alternate;

            cursor: pointer;
        }

        @keyframes pushPulse {
            from {
                transform:
                    scale(0.9);
            }

            to {
                transform:
                    scale(1.12);
            }
        }

        /* ============================
           大当り
        ============================ */

        #screen.jackpot {
            animation:
                jackpotScreen 0.3s infinite alternate;
        }

        @keyframes jackpotScreen {
            from {
                box-shadow:
                    inset 0 0 40px red;
            }

            to {
                box-shadow:
                    inset 0 0 100px gold;
            }
        }

        /* ============================
           保留
        ============================ */

        #hold-area {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 12px;

            padding: 12px;

            background:
                linear-gradient(#171717, #0a0a0a);

            border-left:
                1px solid #444;

            border-right:
                1px solid #444;

            border-bottom:
                1px solid #444;
        }

        #hold-title {
            margin-right: 8px;

            color: #ccc;
            font-weight: bold;
            font-size: 14px;
        }

        .hold-ball {
            width: 30px;
            height: 30px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #777,
                    #252525 60%,
                    #050505
                );

            border:
                2px solid #888;

            box-shadow:
                inset 0 0 5px black;

            transition:
                all 0.3s;
        }

        .hold-blue {
            background:
                radial-gradient(
                    circle at 35% 30%,
                    white,
                    #00bfff 30%,
                    #005ab5 75%
                );

            box-shadow:
                0 0 12px #00aaff;
        }

        .hold-green {
            background:
                radial-gradient(
                    circle at 35% 30%,
                    white,
                    #7dff3b 30%,
                    #167500 75%
                );

            box-shadow:
                0 0 12px #60ff22;
        }

        .hold-red {
            background:
                radial-gradient(
                    circle at 35% 30%,
                    white,
                    #ff3737 30%,
                    #900000 75%
                );

            box-shadow:
                0 0 17px red;
        }

        .hold-gold {
            background:
                radial-gradient(
                    circle at 35% 30%,
                    white,
                    #fff36b 25%,
                    #ffd000 45%,
                    #9b6800 80%
                );

            box-shadow:
                0 0 20px gold;

            animation:
                goldHold 0.35s infinite alternate;
        }

        @keyframes goldHold {
            from {
                transform:
                    scale(1);
            }

            to {
                transform:
                    scale(1.15);
            }
        }

        /* ============================
           操作部
        ============================ */

        #control-panel {
            padding: 16px;

            background:
                linear-gradient(
                    150deg,
                    #292929,
                    #0e0e0e
                );

            border-radius:
                0 0 15px 15px;
        }

        #main-controls {
            display: flex;

            justify-content: center;
            flex-wrap: wrap;

            gap: 10px;
        }

        button {
            border: none;

            color: white;

            cursor: pointer;

            font-weight: bold;

            transition:
                transform 0.1s,
                filter 0.2s;
        }

        button:active {
            transform:
                translateY(3px)
                scale(0.97);
        }

        #shoot-btn {
            width: 190px;
            height: 62px;

            border-radius: 32px;

            font-size: 17px;

            border:
                3px solid #b67aff;

            background:
                linear-gradient(
                    145deg,
                    #7e23d4,
                    #2e004f
                );

            box-shadow:
                0 0 15px #7100d8,
                inset 0 0 10px #b97bff;
        }

        .small-btn {
            min-width: 110px;

            padding: 12px;

            border-radius: 7px;

            background:
                linear-gradient(
                    #444,
                    #1c1c1c
                );

            border:
                1px solid #666;
        }

        .small-btn.active {
            background:
                linear-gradient(
                    #9c1aff,
                    #430071
                );

            box-shadow:
                0 0 10px #9c1aff;
        }

        /* ============================
           ログ
        ============================ */

        #log-panel {
            margin-top: 12px;

            padding: 8px;

            height: 115px;

            overflow-y: auto;

            text-align: left;

            background: #050505;

            border: 1px solid #333;

            font-family: monospace;

            font-size: 11px;

            color: #aaa;
        }

        .log-win {
            color: #ffd700;
            font-weight: bold;
        }

        .log-reach {
            color: #ff6969;
        }

        .log-info {
            color: #6bdcff;
        }

        /* ============================
           バージョン
        ============================ */

        #version-display {
            position: fixed;

            right: 8px;
            bottom: 8px;

            z-index: 100;

            padding: 3px 7px;

            font-size: 10px;
            font-family: monospace;

            color: #aaa;

            background:
                rgba(10,10,10,0.9);

            border:
                1px solid #555;

            border-radius:
                3px;
        }

        /* ============================
           スマホ
        ============================ */

        @media(max-width: 600px) {

            body {
                padding: 4px;
            }

            #machine {
                border-width: 3px;
                padding: 7px;
            }

            #screen {
                min-height: 300px;
            }

            #status-bar {
                font-size: 11px;
            }

            .status-label {
                font-size: 8px;
            }

            .hold-ball {
                width: 25px;
                height: 25px;
            }

            #control-panel {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<div id="machine">

    <div id="machine-title">
        IMPACT PACHINKO
    </div>

    <div id="sub-title">
        SIMULATION SYSTEM
    </div>

    <!-- ステータス -->

    <div id="status-bar">

        <div class="status-item">
            <span class="status-label">MODE</span>
            <span id="mode-display" class="mode-normal">
                通常
            </span>
        </div>

        <div class="status-item">
            <span class="status-label">ST</span>
            <span id="st-count">
                ---
            </span>
        </div>

        <div class="status-item">
            <span class="status-label">SPIN</span>
            <span id="total-spins">
                0
            </span>
        </div>

        <div class="status-item">
            <span class="status-label">BONUS</span>
            <span id="hit-count">
                0
            </span>
        </div>

    </div>

    <!-- 液晶 -->

    <div id="screen">

        <div id="background-message">
            IMPACT
        </div>

        <div id="reels-wrapper">

            <div id="reels">

                <div
                    id="reel1"
                    class="reel"
                >
                    1
                </div>

                <div
                    id="reel2"
                    class="reel"
                >
                    2
                </div>

                <div
                    id="reel3"
                    class="reel"
                >
                    3
                </div>

            </div>

        </div>

        <div id="effect-text">
            玉を打ってください
        </div>

        <div id="big-overlay"></div>

        <div id="flash"></div>

        <div id="push-overlay">

            <button id="push-button-screen">
                PUSH
            </button>

        </div>

    </div>

    <!-- 保留 -->

    <div id="hold-area">

        <span id="hold-title">
            保留
        </span>

        <div
            class="hold-ball"
            id="hold0"
        ></div>

        <div
            class="hold-ball"
            id="hold1"
        ></div>

        <div
            class="hold-ball"
            id="hold2"
        ></div>

        <div
            class="hold-ball"
            id="hold3"
        ></div>

    </div>

    <!-- 操作 -->

    <div id="control-panel">

        <div id="main-controls">

            <button
                id="shoot-btn"
                onclick="addHold()"
            >
                玉を打つ
            </button>

            <button
                id="auto-btn"
                class="small-btn"
                onclick="toggleAuto()"
            >
                AUTO OFF
            </button>

            <button
                id="sound-btn"
                class="small-btn active"
                onclick="toggleSound()"
            >
                SOUND ON
            </button>

        </div>

        <!-- ログ -->

        <div id="log-panel"></div>

    </div>

</div>

<div id="version-display">
    Ver. 2.0
</div>


<script>

/* ========================================
   パラメータ
======================================== */

const RATES = {

    NORMAL: 319.7,

    ST: 99.4,

    ST_RUSH_RATE: 0.70,

    ST_TURNS: 163

};


/* ========================================
   ゲーム状態
======================================== */

let totalSpins = 0;

let hitCount = 0;

let rushCount = 0;

let isST = false;

let stRemains = 0;

let holds = [];

let isSpinning = false;

let autoMode = false;

let autoTimer = null;

let soundEnabled = true;


/* ========================================
   DOM
======================================== */

const reel1 =
    document.getElementById("reel1");

const reel2 =
    document.getElementById("reel2");

const reel3 =
    document.getElementById("reel3");

const screen =
    document.getElementById("screen");

const effectText =
    document.getElementById("effect-text");

const modeDisplay =
    document.getElementById("mode-display");

const stCount =
    document.getElementById("st-count");

const totalSpinsEl =
    document.getElementById("total-spins");

const hitCountEl =
    document.getElementById("hit-count");

const bigOverlay =
    document.getElementById("big-overlay");

const flash =
    document.getElementById("flash");

const pushOverlay =
    document.getElementById("push-overlay");

const autoBtn =
    document.getElementById("auto-btn");

const soundBtn =
    document.getElementById("sound-btn");

const logPanel =
    document.getElementById("log-panel");


/* ========================================
   sleep
======================================== */

function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );

}


/* ========================================
   ログ
======================================== */

function addLog(
    message,
    type = ""
) {

    const now =
        new Date();

    const time =
        now.toLocaleTimeString(
            "ja-JP",
            {
                hour12: false
            }
        );

    const line =
        document.createElement("div");

    line.textContent =
        `[${time}] ${message}`;

    if (type) {

        line.classList.add(type);

    }

    logPanel.appendChild(line);

    logPanel.scrollTop =
        logPanel.scrollHeight;

}


/* ========================================
   簡易効果音
======================================== */

function tone(
    frequency = 440,
    duration = 0.1,
    volume = 0.05
) {

    if (!soundEnabled) {
        return;
    }

    try {

        const AudioContextClass =
            window.AudioContext ||
            window.webkitAudioContext;

        const context =
            new AudioContextClass();

        const oscillator =
            context.createOscillator();

        const gain =
            context.createGain();

        oscillator.type =
            "square";

        oscillator.frequency.value =
            frequency;

        gain.gain.value =
            volume;

        oscillator.connect(gain);

        gain.connect(
            context.destination
        );

        oscillator.start();

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            context.currentTime + duration
        );

        oscillator.stop(
            context.currentTime + duration
        );

    } catch (e) {

        // 音が再生できなくてもゲームは継続

    }

}


/* ========================================
   サウンド
======================================== */

function toggleSound() {

    soundEnabled =
        !soundEnabled;

    soundBtn.textContent =
        soundEnabled
            ? "SOUND ON"
            : "SOUND OFF";

    soundBtn.classList.toggle(
        "active",
        soundEnabled
    );

}


/* ========================================
   AUTO
======================================== */

function toggleAuto() {

    autoMode =
        !autoMode;

    autoBtn.textContent =
        autoMode
            ? "AUTO ON"
            : "AUTO OFF";

    autoBtn.classList.toggle(
        "active",
        autoMode
    );

    if (autoMode) {

        addLog(
            "オート打ち開始",
            "log-info"
        );

        autoTimer =
            setInterval(
                () => {

                    if (
                        holds.length < 4
                    ) {

                        addHold();

                    }

                },
                400
            );

    } else {

        addLog(
            "オート打ち停止",
            "log-info"
        );

        clearInterval(
            autoTimer
        );

        autoTimer = null;

    }

}


/* ========================================
   保留タイプ決定

   ※抽選結果自体はここでは変更しない
   保留色は演出上の期待度示唆
======================================== */

function determineHoldType(
    isWin
) {

    const r =
        Math.random();

    /*
       大当りの場合は
       強い保留が出やすい
    */

    if (isWin) {

        if (r < 0.18) {
            return "gold";
        }

        if (r < 0.62) {
            return "red";
        }

        if (r < 0.85) {
            return "green";
        }

        return "blue";

    }

    /*
       ハズレでも
       赤・金が絶対出ないわけではない
    */

    if (r < 0.003) {
        return "gold";
    }

    if (r < 0.025) {
        return "red";
    }

    if (r < 0.15) {
        return "green";
    }

    return "blue";

}


/* ========================================
   入賞
======================================== */

function addHold() {

    if (
        holds.length >= 4
    ) {

        return;

    }

    const currentRate =
        isST
            ? RATES.ST
            : RATES.NORMAL;

    /*
       大当り抽選
    */

    const randomValue =
        Math.random();

    const winBorder =
        1 / currentRate;

    const isWin =
        randomValue < winBorder;

    const holdType =
        determineHoldType(
            isWin
        );

    holds.push({

        isWin,

        holdType

    });

    addLog(
        `入賞 / ${
            isST
                ? "ST"
                : "通常"
        } / 1/${currentRate}`
    );

    updateHoldUI();

    if (!isSpinning) {

        startNextSpin();

    }

}


/* ========================================
   保留UI
======================================== */

function updateHoldUI() {

    for (
        let i = 0;
        i < 4;
        i++
    ) {

        const ball =
            document.getElementById(
                `hold${i}`
            );

        ball.className =
            "hold-ball";

        if (
            i < holds.length
        ) {

            const hold =
                holds[i];

            ball.classList.add(
                `hold-${hold.holdType}`
            );

        }

    }

}


/* ========================================
   変動開始
======================================== */

async function startNextSpin() {

    if (
        holds.length === 0
    ) {

        isSpinning = false;

        effectText.textContent =
            "玉を打ってください";

        return;

    }

    isSpinning = true;

    const spinData =
        holds.shift();

    updateHoldUI();

    totalSpins++;

    totalSpinsEl.textContent =
        totalSpins;

    if (isST) {

        stRemains--;

        stCount.textContent =
            `${stRemains}回`;

    }

    addLog(
        `変動 #${totalSpins} 開始`,
        "log-info"
    );

    await runSpinAnimation(
        spinData
    );

}


/* ========================================
   リール数字変更
======================================== */

function randomNumber() {

    return (
        Math.floor(
            Math.random() * 9
        ) + 1
    );

}


/* ========================================
   リール高速回転
======================================== */

function startReelSpin(
    reel
) {

    reel.classList.add(
        "spinning"
    );

    return setInterval(
        () => {

            reel.textContent =
                randomNumber();

        },
        55
    );

}


/* ========================================
   リール停止
======================================== */

function stopReel(
    reel,
    number,
    interval
) {

    clearInterval(
        interval
    );

    reel.textContent =
        number;

    reel.classList.remove(
        "spinning"
    );

    reel.classList.remove(
        "stopped"
    );

    void reel.offsetWidth;

    reel.classList.add(
        "stopped"
    );

    tone(
        180,
        0.06,
        0.025
    );

}


/* ========================================
   オーバーレイ
======================================== */

function showOverlay(
    text
) {

    bigOverlay.textContent =
        text;

    bigOverlay.classList.remove(
        "show"
    );

    void bigOverlay.offsetWidth;

    bigOverlay.classList.add(
        "show"
    );

}


/* ========================================
   フラッシュ
======================================== */

function screenFlash(
    type
) {

    flash.className = "";

    void flash.offsetWidth;

    flash.classList.add(
        type
    );

}


/* ========================================
   PUSH演出
======================================== */

async function showPush() {

    pushOverlay.classList.add(
        "visible"
    );

    let pushed =
        false;

    const button =
        document.getElementById(
            "push-button-screen"
        );

    const pushHandler =
        () => {

            pushed = true;

            tone(
                600,
                0.15,
                0.08
            );

            screenFlash(
                "white"
            );

        };

    button.addEventListener(
        "click",
        pushHandler,
        {
            once: true
        }
    );

    /*
       押さなくても進行
    */

    await sleep(
        1100
    );

    pushOverlay.classList.remove(
        "visible"
    );

    return pushed;

}


/* ========================================
   変動アニメーション
======================================== */

async function runSpinAnimation(
    spinData
) {

    const isWin =
        spinData.isWin;

    effectText.textContent =
        "変動開始";

    screen.classList.remove(
        "jackpot"
    );

    [
        reel1,
        reel2,
        reel3
    ].forEach(
        reel => {

            reel.classList.remove(
                "seven"
            );

        }
    );

    tone(
        220,
        0.06
    );

    /*
       リーチ抽選

       当たり = 必ずリーチ
       ハズレ = 約15%
    */

    const isReach =
        isWin ||
        Math.random() < 0.15;

    /*
       図柄決定
    */

    let reachNum;

    if (isWin) {

        /*
           通常時70%でST図柄

           ST中の大当りは7扱い
        */

        if (
            isST ||
            Math.random() <
            RATES.ST_RUSH_RATE
        ) {

            reachNum = 7;

        } else {

            do {

                reachNum =
                    randomNumber();

            }
            while (
                reachNum === 7
            );

        }

    } else {

        reachNum =
            randomNumber();

    }

    /*
       リール開始
    */

    const interval1 =
        startReelSpin(
            reel1
        );

    const interval2 =
        startReelSpin(
            reel2
        );

    const interval3 =
        startReelSpin(
            reel3
        );

    /*
       ST中は高速
    */

    const speed =
        isST
            ? 0.55
            : 1;

    await sleep(
        750 * speed
    );

    /*
       左停止
    */

    const leftNum =
        isReach
            ? reachNum
            : randomNumber();

    stopReel(
        reel1,
        leftNum,
        interval1
    );

    await sleep(
        500 * speed
    );

    /*
       右停止
    */

    let rightNum;

    if (isReach) {

        rightNum =
            reachNum;

    } else {

        do {

            rightNum =
                randomNumber();

        }
        while (
            rightNum === leftNum
        );

    }

    stopReel(
        reel3,
        rightNum,
        interval3
    );

    /*
       リーチなし
    */

    if (!isReach) {

        await sleep(
            450 * speed
        );

        let center;

        do {

            center =
                randomNumber();

        }
        while (
            center === leftNum &&
            leftNum === rightNum
        );

        stopReel(
            reel2,
            center,
            interval2
        );

        effectText.textContent =
            "";

        await sleep(
            650 * speed
        );

        await finalizeSpin(
            false,
            false,
            reachNum
        );

        return;

    }

    /*
       リーチ成立
    */

    addLog(
        `${reachNum}図柄 リーチ成立`,
        "log-reach"
    );

    effectText.textContent =
        "リーチ！！";

    showOverlay(
        "REACH"
    );

    screenFlash(
        "red"
    );

    tone(
        350,
        0.18,
        0.06
    );

    await sleep(
        800 * speed
    );

    /*
       強演出判定
    */

    const hotChance =
        isWin
            ? 0.72
            : 0.08;

    const isHot =
        Math.random() <
        hotChance;

    if (isHot) {

        addLog(
            "強演出発生",
            "log-reach"
        );

        effectText.textContent =
            "激 熱";

        showOverlay(
            "激熱"
        );

        screenFlash(
            "gold"
        );

        tone(
            700,
            0.25,
            0.07
        );

        await sleep(
            900 * speed
        );

    }

    /*
       PUSH演出
    */

    effectText.textContent =
        "ボタンを押せ！";

    await showPush();

    /*
       最終煽り
    */

    effectText.textContent =
        "決まるか！？";

    for (
        let i = 0;
        i < 6;
        i++
    ) {

        screenFlash(
            i % 2 === 0
                ? "red"
                : "white"
        );

        tone(
            300 + i * 60,
            0.05,
            0.03
        );

        await sleep(
            170
        );

    }

    /*
       中リール停止
    */

    if (isWin) {

        stopReel(
            reel2,
            reachNum,
            interval2
        );

    } else {

        let missCenter =
            reachNum + (
                Math.random() <
                0.5
                    ? 1
                    : -1
            );

        if (
            missCenter < 1
        ) {

            missCenter = 9;

        }

        if (
            missCenter > 9
        ) {

            missCenter = 1;

        }

        stopReel(
            reel2,
            missCenter,
            interval2
        );

    }

    await sleep(
        350
    );

    await finalizeSpin(
        isWin,
        true,
        reachNum
    );

}


/* ========================================
   変動結果
======================================== */

async function finalizeSpin(
    isWin,
    isReach,
    reachNum
) {

    if (isWin) {

        /*
           大当り
        */

        hitCount++;

        hitCountEl.textContent =
            hitCount;

        reel1.textContent =
            reachNum;

        reel2.textContent =
            reachNum;

        reel3.textContent =
            reachNum;

        screen.classList.add(
            "jackpot"
        );

        addLog(
            `大当り！ ${reachNum}${reachNum}${reachNum}`,
            "log-win"
        );

        showOverlay(
            "大当り"
        );

        screenFlash(
            "white"
        );

        tone(
            800,
            0.15,
            0.08
        );

        await sleep(
            250
        );

        tone(
            1000,
            0.15,
            0.08
        );

        await sleep(
            250
        );

        tone(
            1200,
            0.4,
            0.08
        );

        if (
            reachNum === 7
        ) {

            /*
               777
            */

            [
                reel1,
                reel2,
                reel3
            ].forEach(
                reel => {

                    reel.classList.add(
                        "seven"
                    );

                }
            );

            effectText.textContent =
                "777 SPECIAL BONUS";

            await sleep(
                800
            );

            showOverlay(
                "777"
            );

            screenFlash(
                "gold"
            );

            await sleep(
                900
            );

            /*
               ST突入
            */

            isST = true;

            stRemains =
                RATES.ST_TURNS;

            rushCount++;

            screen.classList.add(
                "st-background"
            );

            addLog(
                `IMPACT MODE 突入 / ${RATES.ST_TURNS}回`,
                "log-win"
            );

            effectText.textContent =
                "IMPACT MODE 突入";

            showOverlay(
                "IMPACT"
            );

        } else {

            /*
               通常大当り
            */

            effectText.textContent =
                "BONUS";

            isST = false;

            stRemains = 0;

            screen.classList.remove(
                "st-background"
            );

            addLog(
                "通常大当り",
                "log-win"
            );

        }

    } else {

        /*
           ハズレ
        */

        if (isReach) {

            effectText.textContent =
                "ハズレ…";

            addLog(
                "リーチ ハズレ"
            );

            tone(
                130,
                0.25,
                0.025
            );

        } else {

            effectText.textContent =
                "";

        }

        /*
           ST終了判定
        */

        if (
            isST &&
            stRemains <= 0
        ) {

            isST = false;

            stRemains = 0;

            screen.classList.remove(
                "st-background"
            );

            effectText.textContent =
                "IMPACT MODE 終了";

            showOverlay(
                "ST END"
            );

            addLog(
                "ST終了",
                "log-info"
            );

            await sleep(
                1000
            );

        }

    }

    /*
       UI更新
    */

    updateModeUI();

    await sleep(
        isST
            ? 350
            : 850
    );

    screen.classList.remove(
        "jackpot"
    );

    /*
       次の保留
    */

    startNextSpin();

}


/* ========================================
   モードUI
======================================== */

function updateModeUI() {

    if (isST) {

        modeDisplay.textContent =
            "IMPACT";

        modeDisplay.className =
            "mode-st";

        stCount.textContent =
            `${stRemains}回`;

        screen.classList.add(
            "st-background"
        );

    } else {

        modeDisplay.textContent =
            "通常";

        modeDisplay.className =
            "mode-normal";

        stCount.textContent =
            "---";

        screen.classList.remove(
            "st-background"
        );

    }

}


/* ========================================
   初期ログ
======================================== */

addLog(
    "PACHINKO SIM Ver.2.0 起動",
    "log-info"
);

addLog(
    `通常確率 1/${RATES.NORMAL}`
);

addLog(
    `ST確率 1/${RATES.ST} / ${RATES.ST_TURNS}回`
);

</script>
