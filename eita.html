<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パチンコシミュレーター</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        #game-container {
            max-width: 500px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,255,200,0.2);
            border: 2px solid #333;
        }

        /* ステータスバー */
        #status-bar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .mode-normal { color: #00e5ff; }
        .mode-st { color: #ff0055; text-shadow: 0 0 8px #ff0055; }
        .mode-jititan { color: #ffaa00; }

        /* リール表示エリア */
        #reel-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }

        .reel {
            width: 80px;
            height: 100px;
            background: #000;
            border: 3px solid #444;
            border-radius: 10px;
            font-size: 54px;
            font-weight: bold;
            line-height: 100px;
            color: #fff;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.2);
        }

        /* 演出テキスト */
        #effect-text {
            height: 35px;
            font-size: 20px;
            font-weight: bold;
            color: #ffeb3b;
            margin: 10px 0;
        }

        /* 演出用 PUSHボタン */
        #push-btn-container {
            margin: 15px 0;
        }

        #push-btn {
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            color: #888;
            background: linear-gradient(135deg, #333, #555);
            border: 3px solid #666;
            border-radius: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            cursor: not-allowed;
            transition: all 0.2s;
        }

        /* PUSHボタン点滅アクティブ時 */
        #push-btn.active {
            color: #fff;
            background: linear-gradient(135deg, #ff0055, #ff5500);
            border-color: #ffff00;
            box-shadow: 0 0 15px #ff0055;
            cursor: pointer;
            animation: pulse 0.6s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        /* 保留表示 */
        #hold-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
        }

        .hold-ball {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #444;
            border: 1px solid #666;
        }

        .hold-blue { background: #0088ff; box-shadow: 0 0 8px #0088ff; }
        .hold-red { background: #ff0000; box-shadow: 0 0 8px #ff0000; }

        /* コントロールボタン */
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }

        button.ctrl-btn {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #00e5ff;
            color: #000;
            transition: opacity 0.2s;
        }

        button.ctrl-btn:hover { opacity: 0.8; }
        #auto-btn.auto-on { background: #ff0055; color: #fff; }

        /* デバッグ・検証パネル */
        #debug-panel {
            background: #111;
            border: 1px dashed #555;
            padding: 10px;
            margin-top: 15px;
            border-radius: 8px;
        }

        #debug-panel button {
            padding: 6px 12px;
            margin: 3px;
            font-size: 12px;
            cursor: pointer;
            background: #333;
            color: #fff;
            border: 1px solid #666;
            border-radius: 4px;
        }

        /* 履歴・データ表示 */
        #history-container {
            margin-top: 20px;
            text-align: left;
            background: #252525;
            padding: 10px 15px;
            border-radius: 8px;
        }

        ul { list-style: none; padding: 0; margin: 5px 0 0 0; }
        li {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #333;
            padding: 4px 0;
            font-size: 14px;
        }

        .tag-st { color: #ff0055; }
        .tag-jititan { color: #ffaa00; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- ステータスバー -->
    <div id="status-bar">
        <span id="mode-display" class="mode-normal">通常モード</span>
        <span id="st-count"></span>
        <span>回転数: <span id="total-spins">0</span></span>
    </div>

    <!-- リール表示 -->
    <div id="reel-container">
        <div id="reel1" class="reel">1</div>
        <div id="reel2" class="reel">2</div>
        <div id="reel3" class="reel">3</div>
    </div>

    <!-- 演出表示 -->
    <div id="effect-text"></div>

    <!-- ★ 演出用 PUSHボタン -->
    <div id="push-btn-container">
        <button id="push-btn" onclick="onPushBtnClick()" disabled>PUSH</button>
    </div>

    <!-- 保留ランプ -->
    <div id="hold-container">
        <div id="hold0" class="hold-ball"></div>
        <div id="hold1" class="hold-ball"></div>
        <div id="hold2" class="hold-ball"></div>
        <div id="hold3" class="hold-ball"></div>
    </div>

    <!-- 操作ボタン -->
    <div class="btn-group">
        <button class="ctrl-btn" onclick="addHold()">チャッカー入賞</button>
        <button id="auto-btn" class="ctrl-btn" onclick="toggleAutoPlay()">オート: OFF</button>
    </div>

    <!-- デバッグ用強制大当りボタン -->
    <div id="debug-panel">
        <span style="font-size: 12px; color: #aaa;">【デバッグ機能】</span><br>
        <button onclick="debugTriggerWin('NORMAL_EVEN')">通常当り(偶数)</button>
        <button onclick="debugTriggerWin('NORMAL_ODD')">確変当り(奇数)</button>
        <button onclick="debugTriggerWin('RIGHT_WIN')">右打ち中当り</button>
    </div>

    <!-- 履歴・成績表示 -->
    <div id="history-container">
        <div style="display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px;">
            <span>総大当り: <span id="total-wins">0</span>回</span>
            <span>最高継続: <span id="max-chain">0</span>連</span>
        </div>
        <ul id="history-list"></ul>
    </div>
</div>

<script>
    // 音声ファイルの指定
    const seReachNormal = new Audio('sounds/reach.mp3');
    const seImpactFlash = new Audio('sounds/impact_flash.mp3');

    // パラメータ設定
    const RATES = {
        NORMAL: 319.7,      
        ST: 99.4,           
        ODD_WIN_RATE: 0.59, 
        ST_TURNS: 163,      
        JITITAN_TURNS: 100  
    };

    const ODD_NUMBERS = [1, 3, 5, 7, 9];
    const EVEN_NUMBERS = [2, 4, 6, 8];
    const ALL_NUMBERS = [1, 2, 3, 4, 5, 6, 7, 8, 9];

    const FIXED_LOSE_PATTERNS = [
        [1, 2, 3], [2, 4, 6], [3, 5, 7], 
        [4, 1, 5], [5, 8, 2], [6, 3, 9], [8, 2, 4]
    ];

    let totalSpins = 0;
    let spinAtLastWin = 0;
    let gameMode = "NORMAL"; 
    let modeRemains = 0;
    let holds = [];
    let isSpinning = false;

    let isAutoPlay = false;
    let autoPlayInterval = null;

    let winHistory = [];
    let currentChain = 0;
    let maxChain = 0;
    let totalWinCount = 0;

    // 変動時間計測用（内部処理）
    let spinStartTime = 0;
    let lastSpinDuration = 0;

    // ★ 演出用PUSHボタンの状態制御フラグ
    let canPush = false;
    let currentIsWin = false;
    let currentIsOdd = false;

    // DOM要素
    const elReel1 = document.getElementById('reel1');
    const elReel2 = document.getElementById('reel2');
    const elReel3 = document.getElementById('reel3');
    const elEffect = document.getElementById('effect-text');
    const elMode = document.getElementById('mode-display');
    const elStCount = document.getElementById('st-count');
    const elTotalSpins = document.getElementById('total-spins');
    const elHistoryList = document.getElementById('history-list');
    const elTotalWins = document.getElementById('total-wins');
    const elMaxChain = document.getElementById('max-chain');
    const elAutoBtn = document.getElementById('auto-btn');
    const elPushBtn = document.getElementById('push-btn');

    function addHold() {
        if (holds.length >= 4) return;

        const currentRate = (gameMode === "ST") ? RATES.ST : RATES.NORMAL;
        const isWin = Math.random() < (1 / currentRate);
        
        holds.push({ isWin: isWin });
        updateHoldUI();

        if (!isSpinning) {
            startNextSpin();
        }
    }

    function toggleAutoPlay() {
        isAutoPlay = !isAutoPlay;

        if (isAutoPlay) {
            elAutoBtn.textContent = "オート: ON";
            elAutoBtn.classList.add('auto-on');
            autoPlayInterval = setInterval(() => {
                if (holds.length < 4) {
                    addHold();
                }
            }, 300);
        } else {
            elAutoBtn.textContent = "オート: OFF";
            elAutoBtn.classList.remove('auto-on');
            clearInterval(autoPlayInterval);
        }
    }

    function updateHoldUI() {
        for (let i = 0; i < 4; i++) {
            const ball = document.getElementById(`hold${i}`);
            ball.className = 'hold-ball';
            if (i < holds.length) {
                if (holds[i].isWin && Math.random() < 0.8) {
                    ball.classList.add('hold-red');
                } else {
                    ball.classList.add('hold-blue');
                }
            }
        }
    }

    function startNextSpin() {
        if (holds.length === 0) {
            isSpinning = false;
            return;
        }

        isSpinning = true;
        const currentSpinData = holds.shift();
        updateHoldUI();

        totalSpins++;
        spinAtLastWin++;
        elTotalSpins.textContent = totalSpins;

        if (gameMode !== "NORMAL") {
            modeRemains--;
            elStCount.textContent = `残り: ${modeRemains}回`;
        }

        runSpinAnimation(currentSpinData.isWin);
    }

    // デバッグ用大当りトリガー
    function debugTriggerWin(type) {
        if (isSpinning) return;

        totalSpins++;
        spinAtLastWin++;
        elTotalSpins.textContent = totalSpins;

        isSpinning = true;

        if (type === 'NORMAL_EVEN') {
            gameMode = "NORMAL";
            runSpinAnimation(true, false);
        } else if (type === 'NORMAL_ODD') {
            gameMode = "NORMAL";
            runSpinAnimation(true, true);
        } else if (type === 'RIGHT_WIN') {
            if (gameMode === "NORMAL") {
                gameMode = "ST";
                modeRemains = RATES.ST_TURNS;
            } else {
                modeRemains--;
            }
            runSpinAnimation(true, true);
        }
    }

    function getNextNum(current) {
        let val = parseInt(current) || 1;
        return (val % 9) + 1;
    }

    function runSpinAnimation(isWin, forcedIsOdd = null) {
        elEffect.textContent = "";
        deactivatePushBtn(); // 変動開始時はボタンオフ
        
        spinStartTime = performance.now(); // 開始時刻を記録

        // 当落情報をグローバル保持
        currentIsWin = isWin;

        // 時短中のハズレ時リーチ発生率を3%に削減（通常・ST中は15%）
        const reachRate = (gameMode === "JITITAN") ? 0.03 : 0.15;
        const isReach = isWin || (Math.random() < reachRate);

        let targetLeft, targetCenter, targetRight;

        if (isWin) {
            if (forcedIsOdd !== null) {
                currentIsOdd = forcedIsOdd;
            } else if (gameMode === "ST" || gameMode === "JITITAN") {
                currentIsOdd = true;
            } else {
                currentIsOdd = Math.random() < RATES.ODD_WIN_RATE;
            }

            const winArray = currentIsOdd ? ODD_NUMBERS : EVEN_NUMBERS;
            const winNum = winArray[Math.floor(Math.random() * winArray.length)];
            
            targetLeft = winNum;
            targetCenter = winNum;
            targetRight = winNum;
        } else if (isReach) {
            currentIsOdd = false;
            const reachNum = ALL_NUMBERS[Math.floor(Math.random() * ALL_NUMBERS.length)];
            targetLeft = reachNum;
            targetRight = reachNum;
            targetCenter = (reachNum % 9) + 1;
        } else {
            currentIsOdd = false;
            const pattern = FIXED_LOSE_PATTERNS[Math.floor(Math.random() * FIXED_LOSE_PATTERNS.length)];
            targetLeft = pattern[0];
            targetCenter = pattern[1];
            targetRight = pattern[2];
        }

        let step = 0;
        // 時短中・ST中の通常変動時間を短縮
        const spinTimeLeftRight = (gameMode === "ST" || gameMode === "JITITAN") ? 20 : 10;

        const interval = setInterval(() => {
            step++;
            elReel1.textContent = getNextNum(elReel1.textContent);
            elReel2.textContent = getNextNum(elReel2.textContent);
            elReel3.textContent = getNextNum(elReel3.textContent);

            if (step >= spinTimeLeftRight) {
                clearInterval(interval);
                elReel1.textContent = targetLeft;
                elReel3.textContent = targetRight;

                if (isReach) {
                    // ★ リーチが確定したら演出用PUSHボタンを点滅有効化！
                    activatePushBtn();

                    // 音演出判定
                    if (gameMode === "NORMAL" && isWin && currentIsOdd && Math.random() < 0.10) {
                        seImpactFlash.currentTime = 0;
                        seImpactFlash.play().catch(e => console.log(e));
                        elEffect.textContent = "⚡🌈 インパクトフラッシュ発生！！ 🌈⚡";
                    } else if (gameMode === "ST" && isWin && Math.random() < 0.50) {
                        seImpactFlash.currentTime = 0;
                        seImpactFlash.play().catch(e => console.log(e));
                        elEffect.textContent = "⚡🌈 インパクトフラッシュ発生！！ 🌈⚡";
                    } else if (gameMode === "JITITAN" && isWin && Math.random() < 0.20) {
                        seImpactFlash.currentTime = 0;
                        seImpactFlash.play().catch(e => console.log(e));
                        elEffect.textContent = "⚡🌈 インパクトフラッシュ発生！！ 🌈⚡";
                    } else {
                        seReachNormal.currentTime = 0;
                        seReachNormal.play().catch(e => console.log(e));
                        elEffect.textContent = "🔥 リーチ！！ 🔥";
                    }

                    let centerStep = 0;
                    // モード毎のリーチ演出時間（通常時:50, ST時:25, 時短時:15）
                    let centerSpinTime = 50;
                    if (gameMode === "ST") {
                        centerSpinTime = 25;
                    } else if (gameMode === "JITITAN") {
                        centerSpinTime = 15;
                    }

                    const centerInterval = setInterval(() => {
                        centerStep++;
                        elReel2.textContent = getNextNum(elReel2.textContent);

                        if (centerStep >= centerSpinTime) {
                            clearInterval(centerInterval);
                            elReel2.textContent = targetCenter;
                            
                            if (isWin) {
                                recordWinHistory(currentIsOdd, targetCenter);

                                if (currentIsOdd) {
                                    elEffect.textContent = `【${targetCenter}揃い】ST「インパクトモード」突入！`;
                                    gameMode = "ST";
                                    modeRemains = RATES.ST_TURNS;
                                } else {
                                    elEffect.textContent = `【${targetCenter}揃い】「チャンスタイム(時短100回)」突入`;
                                    gameMode = "JITITAN";
                                    modeRemains = RATES.JITITAN_TURNS;
                                }
                            } else {
                                elEffect.textContent = "ハズレ...";
                            }

                            deactivatePushBtn();
                            finishSpin();
                        }
                    }, 60);

                } else {
                    elReel2.textContent = targetCenter;
                    finishSpin();
                }
            }
        }, 50);
    }

    // ★ 演出用PUSHボタンが押された時の挙動
    function onPushBtnClick() {
        if (!canPush) return;
        canPush = false; // 連打・重複防止

        elPushBtn.style.transform = "scale(0.95)";
        setTimeout(() => elPushBtn.style.transform = "scale(1)", 100);

        if (currentIsWin) {
            seImpactFlash.currentTime = 0;
            seImpactFlash.play().catch(e => console.log(e));

            if (currentIsOdd) {
                elEffect.textContent = "⚡🌈 PUSH成功！【確変大当り】 🌈⚡";
            } else {
                elEffect.textContent = "🎉 PUSH成功！【大当り】 🎉";
            }
        } else {
            elEffect.textContent = "❌ PUSH失敗...（ハズレ）";
        }

        deactivatePushBtn();
    }

    function activatePushBtn() {
        canPush = true;
        elPushBtn.disabled = false;
        elPushBtn.classList.add('active');
        elPushBtn.textContent = "🔥 PUSH!! 🔥";
    }

    function deactivatePushBtn() {
        canPush = false;
        elPushBtn.disabled = true;
        elPushBtn.classList.remove('active');
        elPushBtn.textContent = "PUSH";
    }

    function recordWinHistory(isOddWin, winNum) {
        totalWinCount++;
        totalSpins = 0;
        elTotalSpins.textContent = totalSpins;
        
        let typeName = "";
        let cssClass = "";

        if (gameMode === "ST") {
            currentChain++;
            typeName = `${currentChain}連目 (ST中)`;
            cssClass = "tag-st";
        } else if (gameMode === "JITITAN") {
            currentChain++;
            typeName = `${currentChain}連目 (引き戻し)`;
            cssClass = "tag-st";
        } else {
            currentChain = 1;
            if (isOddWin) {
                typeName = "初当り (RUSH突入)";
                cssClass = "tag-st";
            } else {
                typeName = "初当り (時短突入)";
                cssClass = "tag-jititan";
            }
        }

        if (currentChain > maxChain) {
            maxChain = currentChain;
        }

        winHistory.unshift({
            count: totalWinCount,
            spins: spinAtLastWin,
            num: winNum,
            type: typeName,
            css: cssClass
        });

        spinAtLastWin = 0;
        updateHistoryUI();
    }

    function updateHistoryUI() {
        elTotalWins.textContent = totalWinCount;
        elMaxChain.textContent = maxChain;

        elHistoryList.innerHTML = "";
        winHistory.slice(0, 10).forEach(item => {
            const li = document.createElement('li');
            li.innerHTML = `
                <span><b class="${item.css}">${item.type}</b> (${item.num}図柄)</span>
                <span><b>${item.spins}</b>回転目</span>
            `;
            elHistoryList.appendChild(li);
        });
    }

    function finishSpin() {
        // 変動時間の内部計算（コンソール出力用）
        if (spinStartTime > 0) {
            lastSpinDuration = Math.round(performance.now() - spinStartTime);
            console.log(`[変動時間] ${lastSpinDuration}ms (${(lastSpinDuration / 1000).toFixed(2)}秒)`);
        }

        if (gameMode !== "NORMAL" && modeRemains <= 0) {
            elEffect.textContent = `${gameMode === "ST" ? "ST" : "時短"}終了...`;
            gameMode = "NORMAL";
            modeRemains = 0;
            currentChain = 0;
        }

        if (gameMode === "ST") {
            elMode.textContent = "インパクトモード (ST)";
            elMode.className = "mode-st";
            elStCount.textContent = `ST残り: ${modeRemains}回`;
        } else if (gameMode === "JITITAN") {
            elMode.textContent = "チャンスタイム (時短)";
            elMode.className = "mode-jititan";
            elStCount.textContent = `時短残り: ${modeRemains}回`;
        } else {
            elMode.textContent = "通常モード";
            elMode.className = "mode-normal";
            elStCount.textContent = "";
        }

        setTimeout(() => {
            startNextSpin();
        }, 800);
    }
</script>

</body>
</html>
