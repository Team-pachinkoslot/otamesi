<!DOCTYPE html>

<html lang="ja">

<head>

    <meta charset="UTF-8">

    <title>エヴァ15風 パチンコ SIM</title>

    <style>

        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        #game-container {
            width: 420px;
            margin: 0 auto;
            background-color: #222;
            border: 4px solid #555;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 0 20px rgba(128, 0, 128, 0.5);
        }

        #status-bar {
            display: flex;
            justify-content: space-between;
            background: #333;
            padding: 8px;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 14px;
        }

        .mode-normal {
            color: #00ffff;
        }

        .mode-st {
            color: #ff00ff;
            animation: blink 0.5s infinite alternate;
        }

        .mode-jititan {
            color: #00ff66;
        }

        @keyframes blink {
            from {
                opacity: 1;
            }

            to {
                opacity: 0.6;
            }
        }


        #screen {
            background: #000;
            border: 2px solid #888;
            height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        #reels {
            display: flex;
            gap: 15px;
            font-size: 64px;
            font-weight: bold;
            text-shadow: 0 0 10px #fff;
        }

        #effect-text {
            font-size: 18px;
            color: #ffcc00;
            height: 30px;
            margin-top: 15px;
            font-weight: bold;
        }


        #hold-container {
            margin: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .hold-ball {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #444;
            border: 1px solid #888;
        }

        .hold-blue {
            background: #0088ff;
            box-shadow: 0 0 5px #0088ff;
        }

        .hold-red {
            background: #ff0000;
            box-shadow: 0 0 8px #ff0000;
        }


        #controls {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button {
            padding: 12px 18px;
            font-size: 16px;
            background: linear-gradient(135deg, #8a2be2, #4b0082);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            font-weight: bold;
        }

        button:active {
            transform: translateY(2px);
        }

        #auto-btn {
            background: linear-gradient(135deg, #444, #222);
            border: 1px solid #666;
        }

        #auto-btn.auto-on {
            background: linear-gradient(135deg, #ff0055, #990033);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.6);
        }


        /* デバッグ操作用スタイル */

        #debug-controls {
            margin-top: 15px;
            padding: 10px;
            background-color: #2a2a2a;
            border: 1px dashed #777;
            border-radius: 5px;
        }

        .debug-title {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 8px;
            font-weight: bold;
        }

        #debug-controls button {
            padding: 6px 10px;
            font-size: 12px;
            background: linear-gradient(135deg, #444, #555);
            border: 1px solid #888;
        }


        /* ========================================
           インパクトフラッシュ設定
        ======================================== */

        #impact-flash-controls {
            margin-top: 15px;
            padding: 10px;
            background-color: #2a2a2a;
            border: 1px dashed #ffcc00;
            border-radius: 5px;
        }

        #impact-flash-title {
            font-size: 13px;
            color: #ffcc00;
            margin-bottom: 8px;
            font-weight: bold;
        }

        #impact-flash-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        #impact-flash-buttons button {
            padding: 8px 12px;
            font-size: 12px;
        }

        #impact-high-btn {
            background: linear-gradient(135deg, #ff9900, #cc3300);
        }

        #impact-reset-btn {
            background: linear-gradient(135deg, #555, #333);
        }

        #impact-rate-display {
            margin-top: 10px;
            font-size: 12px;
            color: #ccc;
        }

        #impact-mode-display {
            margin-top: 5px;
            font-size: 12px;
            color: #00ffff;
            font-weight: bold;
        }


        #history-box {
            margin-top: 15px;
            background-color: #1a1a1a;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 10px;
            text-align: left;
            font-size: 13px;
        }

        #history-title {
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 5px;
            border-bottom: 1px solid #444;
            padding-bottom: 3px;
            display: flex;
            justify-content: space-between;
        }

        #history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 120px;
            overflow-y: auto;
        }

        #history-list li {
            padding: 3px 0;
            border-bottom: 1px dashed #333;
            display: flex;
            justify-content: space-between;
        }

        .tag-st {
            color: #ff00ff;
            font-weight: bold;
        }

        .tag-normal {
            color: #00ffff;
        }

        .tag-jititan {
            color: #00ff66;
        }

    </style>

</head>

<body>


<div id="game-container">
    <div id="status-bar">
        <span id="mode-display" class="mode-normal">
            通常モード
        </span>
        <span id="st-count"></span>
        <span>
            回転数:
            <span id="total-spins">0</span>
        </span>
    </div>

    <div id="screen">
        <div id="reels">
            <span id="reel1">1</span>
            <span id="reel2">2</span>
            <span id="reel3">3</span>
        </div>
        <div id="effect-text"></div>
    </div>

    <div id="hold-container">
        <span>保留:</span>
        <div class="hold-ball" id="hold0"></div>
        <div class="hold-ball" id="hold1"></div>
        <div class="hold-ball" id="hold2"></div>
        <div class="hold-ball" id="hold3"></div>
    </div>

    <div id="controls">
        <button
            id="shoot-btn"
            onclick="addHold()">
            玉を打つ
        </button>

        <button
            id="auto-btn"
            onclick="toggleAutoPlay()">
            オート: OFF
        </button>
    </div>


    <!-- デバッグ用ボタンエリア -->

    <div id="debug-controls">
        <div class="debug-title">
            🛠 デバッグ操作（テスト用大当りボタン）
        </div>
        <div
            style="
                display: flex;
                gap: 5px;
                justify-content: center;
            ">
            <button
                onclick="debugTriggerWin('NORMAL_EVEN')">
                通常: 時短当り
            </button>
            <button
                onclick="debugTriggerWin('NORMAL_ODD')">
                通常: RUSH当り
            </button>
            <button
                onclick="debugTriggerWin('RIGHT_WIN')">
                右打ち中大当り
            </button>
        </div>
    </div>


    <!-- ========================================
         インパクトフラッシュ占有率変更
    ========================================= -->

    <div id="impact-flash-controls">
        <div id="impact-flash-title">
            ⚡ インパクトフラッシュ占有率設定
        </div>

        <div id="impact-flash-buttons">
            <button
                id="impact-high-btn"
                onclick="setImpactFlashHigh()">
                高占有率に変更
            </button>

            <button
                id="impact-reset-btn"
                onclick="resetImpactFlashRates()">
                元に戻す
            </button>
        </div>

        <div id="impact-rate-display">
            通常 10% / ST 50% / 時短 20%
        </div>

        <div id="impact-mode-display">
            現在：通常設定
        </div>
    </div>

    <div id="history-box">
        <div id="history-title">
            <span>
                大当り履歴
            </span>
            <span>
                通算大当り:
                <span id="total-wins">0</span>
                回
                (最高
                <span id="max-chain">0</span>
                連)
            </span>
        </div>

        <ul id="history-list">
            <li style="color: #888;">
                履歴はありません
            </li>
        </ul>
    </div>
</div>

<div id="version-display">
    Ver. 1.9.7
</div>

<script>


    // ========================================
    // 音声ファイルの指定
    // ========================================

    const seReachNormal =
        new Audio('');

    const seImpactFlash =
        new Audio('./sound_01.mp3');

    // ========================================
    // パラメータ設定
    // ========================================

    const RATES = {
        NORMAL: 319.7,
        ST: 99.4,
        ODD_WIN_RATE: 0.59,
        ST_TURNS: 163,
        JITITAN_TURNS: 100
    };

    // ========================================
    // インパクトフラッシュ占有率
    // ========================================

    // 元の設定
    const IMPACT_FLASH_DEFAULT = {
        NORMAL: 0.10,
        ST: 0.50,
        JITITAN: 0.20
    };

    // 高占有率設定
    const IMPACT_FLASH_HIGH = {
        NORMAL: 0.30,
        ST: 0.70,
        JITITAN: 0.40
    };


    // 現在使用している設定

    let impactFlashRates = {
        NORMAL: IMPACT_FLASH_DEFAULT.NORMAL,
        ST: IMPACT_FLASH_DEFAULT.ST,
        JITITAN: IMPACT_FLASH_DEFAULT.JITITAN
    };

    // ========================================
    // 高占有率へ変更
    // ========================================

    function setImpactFlashHigh() {
        impactFlashRates.NORMAL =
            IMPACT_FLASH_HIGH.NORMAL;
        impactFlashRates.ST =
            IMPACT_FLASH_HIGH.ST;
        impactFlashRates.JITITAN =
            IMPACT_FLASH_HIGH.JITITAN;

        updateImpactFlashDisplay(true);
    }


    // ========================================
    // 元に戻す
    // ========================================

    function resetImpactFlashRates() {
        impactFlashRates.NORMAL =
            IMPACT_FLASH_DEFAULT.NORMAL;
        impactFlashRates.ST =
            IMPACT_FLASH_DEFAULT.ST;
        impactFlashRates.JITITAN =
            IMPACT_FLASH_DEFAULT.JITITAN;

        updateImpactFlashDisplay(false);
    }

    // ========================================
    // インパクトフラッシュ設定表示更新
    // ========================================
    function updateImpactFlashDisplay(isHigh) {
        const rateDisplay =
            document.getElementById(
                'impact-rate-display'
            );

        const modeDisplay =
            document.getElementById(
                'impact-mode-display'
            );

        rateDisplay.textContent =
            `通常 ${Math.round(
                impactFlashRates.NORMAL * 100
            )}% / ` +

            `ST ${Math.round(
                impactFlashRates.ST * 100
            )}% / ` +

            `時短 ${Math.round(
                impactFlashRates.JITITAN * 100
            )}%`;

        if (isHigh) {
            modeDisplay.textContent =
                "現在：高占有率設定";
            modeDisplay.style.color =
                "#ffcc00";
        }

        else {
            modeDisplay.textContent =
                "現在：通常設定";
            modeDisplay.style.color =
                "#00ffff";
        }
    }



    // ========================================
    // 図柄
    // ========================================

    const ODD_NUMBERS = [
        1,
        3,
        5,
        7,
        9
    ];


    const EVEN_NUMBERS = [
        2,
        4,
        6,
        8
    ];


    const ALL_NUMBERS = [
        1,
        2,
        3,
        4,
        5,
        6,
        7,
        8,
        9
    ];


    // ========================================
    // ハズレ目
    // ========================================

    const FIXED_LOSE_PATTERNS = [

        [1, 9, 3],

        [2, 4, 6],

        [3, 5, 7],

        [9, 5, 3],

        [2, 6, 3],

        [3, 9, 1],

        [4, 1, 5],

        [5, 8, 2],

        [6, 3, 9],

        [8, 2, 4],

        [1, 6, 8],

        [4, 5, 9],

        [5, 2, 8],

        [6, 1, 8],

        [7, 9, 5],

        [8, 3, 5],

        [9, 4, 2]

    ];


    // ========================================
    // ゲーム状態
    // ========================================

    let totalSpins = 0;
    let spinAtLastWin = 0;
    let gameMode =
        "NORMAL";
    let modeRemains = 0;
    let holds = [];
    let isSpinning = false;

    let isAutoPlay = false;
    let autoPlayInterval = null;

    let winHistory = [];
    let currentChain = 0;
    let maxChain = 0;
    let totalWinCount = 0;

    let spinStartTime = 0;
    let lastSpinDuration = 0;



    // ========================================
    // HTML要素
    // ========================================

    const elReel1 =
        document.getElementById(
            'reel1'
        );

    const elReel2 =
        document.getElementById(
            'reel2'
        );

    const elReel3 =
        document.getElementById(
            'reel3'
        );

    const elEffect =
        document.getElementById(
            'effect-text'
        );

    const elMode =
        document.getElementById(
            'mode-display'
        );

    const elStCount =
        document.getElementById(
            'st-count'
        );

    const elTotalSpins =
        document.getElementById(
            'total-spins'
        );

    const elHistoryList =
        document.getElementById(
            'history-list'
        );

    const elTotalWins =
        document.getElementById(
            'total-wins'
        );

    const elMaxChain =
        document.getElementById(
            'max-chain'
        );

    const elAutoBtn =
        document.getElementById(
            'auto-btn'
        );



    // ========================================
    // 保留追加
    // ========================================

    function addHold() {

        if (holds.length >= 4) {
            return;
        }

        const currentRate =
            (gameMode === "ST")
                ? RATES.ST
                : RATES.NORMAL;

        const isWin =
            Math.random() <
            (1 / currentRate);

        holds.push({
            isWin: isWin
        });

        updateHoldUI();

        if (!isSpinning) {
            startNextSpin();
        }
    }



    // ========================================
    // オートプレイ
    // ========================================

    function toggleAutoPlay() {

        isAutoPlay =
            !isAutoPlay;

        if (isAutoPlay) {

            elAutoBtn.textContent =
                "オート: ON";

            elAutoBtn.classList.add(
                'auto-on'
            );

            autoPlayInterval =
                setInterval(() => {

                    if (
                        holds.length < 4
                    ) {
                        addHold();
                    }

                }, 300);
        }else {
            elAutoBtn.textContent =
                "オート: OFF";

            elAutoBtn.classList.remove(
                'auto-on'
            );
            
            clearInterval(
                autoPlayInterval
            );
        }
    }



    // ========================================
    // 保留表示
    // ========================================

    function updateHoldUI() {

        for (
            let i = 0;
            i < 4;
            i++
        ) {
            const ball =
                document.getElementById(
                    `hold${i}`
                );

            ball.className =
                'hold-ball';
            if (
                i < holds.length
            ) {
                if (
                    holds[i].isWin &&
                    Math.random() < 0.8
                ) {
                    ball.classList.add(
                        'hold-red'
                    );
                }else {
                    ball.classList.add(
                        'hold-blue'
                    );
                }
            }
        }
    }



    // ========================================
    // 次の変動
    // ========================================

    function startNextSpin() {

        if (
            holds.length === 0
        ) {
            isSpinning = false;
            return;
        }

        isSpinning = true;

        const currentSpinData =
            holds.shift();
        updateHoldUI();

        totalSpins++;
        spinAtLastWin++;

        elTotalSpins.textContent =
            totalSpins;
        if (
            gameMode !== "NORMAL"
        ) {

            modeRemains--;

            elStCount.textContent =
                `残り: ${modeRemains}回`;
        }

        runSpinAnimation(
            currentSpinData.isWin
        );
    }



    // ========================================
    // デバッグ用大当りトリガー
    // ========================================

    function debugTriggerWin(type) {

        if (isSpinning) {
            return;
        }

        totalSpins++;
        spinAtLastWin++;

        elTotalSpins.textContent =
            totalSpins;
        isSpinning = true;

        if (
            type === 'NORMAL_EVEN'
        ) {

            gameMode =
                "NORMAL";

            runSpinAnimation(
                true,
                false
            );
        }else if (
            type === 'NORMAL_ODD'
        ) {

            gameMode =
                "NORMAL";

            runSpinAnimation(
                true,
                true
            );
        }else if (
            type === 'RIGHT_WIN'
        ) {
            if (
                gameMode === "NORMAL"
            ) {
                gameMode =
                    "ST";
                modeRemains =
                    RATES.ST_TURNS;
            }else {
                modeRemains--;
            }
            runSpinAnimation(
                true,
                true
            );
        }
    }



    // ========================================
    // 次の数字
    // ========================================

    function getNextNum(current) {

        let val =
            parseInt(current) || 1;
        return (
            val % 9
        ) + 1;
    }



    // ========================================
    // メイン変動処理
    // ========================================

    function runSpinAnimation(
        isWin,
        forcedIsOdd = null
    ) {
        elEffect.textContent =
            "";
        spinStartTime =
            performance.now();

        // ========================================
        // リーチ発生率
        // ========================================

        const reachRate =
            (
                gameMode ===
                "JITITAN"
            )
                ? 0.03
                : 0.15;

        const isReach =
            isWin ||
            (
                Math.random() <
                reachRate
            );

        let targetLeft;
        let targetCenter;
        let targetRight;

        let isOddWin =
            false;



        // ========================================
        // 大当り
        // ========================================

        if (isWin) {

            if (
                forcedIsOdd !== null
            ){
                isOddWin =
                    forcedIsOdd;
            }else if (
                gameMode === "ST" ||
                gameMode === "JITITAN"
            ){
                isOddWin =
                    true;
            }else {
                isOddWin =
                    Math.random() <
                    RATES.ODD_WIN_RATE;
            }

            const winArray =
                isOddWin
                    ? ODD_NUMBERS
                    : EVEN_NUMBERS;

            const winNum =
                winArray[
                    Math.floor(
                        Math.random() *
                        winArray.length
                    )
                ];

            targetLeft =
                winNum;
            targetCenter =
                winNum;
            targetRight =
                winNum;
        }


        // ========================================
        // リーチハズレ
        // ========================================

        else if (isReach) {

            const reachNum =
                ALL_NUMBERS[
                    Math.floor(
                        Math.random() *
                        ALL_NUMBERS.length
                    )
                ];

            targetLeft =
                reachNum;

            targetRight =
                reachNum;

            targetCenter =
                (reachNum % 9) + 1;
        }

        // ========================================
        // 通常ハズレ
        // ========================================

        else {

            const pattern =
                FIXED_LOSE_PATTERNS[
                    Math.floor(
                        Math.random() *
                        FIXED_LOSE_PATTERNS.length
                    )
                ];

            targetLeft =
                pattern[0];

            targetCenter =
                pattern[1];

            targetRight =
                pattern[2];
        }



        // ========================================
        // 図柄変動開始
        // ========================================

        let step = 0;

        const spinTimeLeftRight =
            (gameMode === "ST")
                ? 8
                : 15;

        const interval =

            setInterval(() => {
                step++;

                elReel1.textContent =
                    getNextNum(
                        elReel1.textContent
                    );

                elReel2.textContent =
                    getNextNum(
                        elReel2.textContent
                    );

                elReel3.textContent =
                    getNextNum(
                        elReel3.textContent
                    );



                // ========================================
                // 左右停止
                // ========================================

                if (
                    step >=
                    spinTimeLeftRight
                ){
                    clearInterval(
                        interval
                    );

                    elReel1.textContent =
                        targetLeft;

                    elReel3.textContent =
                        targetRight;



                    // ========================================
                    // リーチ
                    // ========================================

                    if (isReach) {
                        let isSpecialReachSound =
                            false;

                        // ========================================
                        // インパクトフラッシュ判定
                        // ========================================

                        // ----------------------------------------
                        // 1.
                        // 通常時
                        // 奇数図柄大当り
                        // ----------------------------------------

                        if (
                            gameMode === "NORMAL" &&
                            isWin &&
                            isOddWin &&
                            Math.random() <
                            impactFlashRates.NORMAL
                        ){
                            isSpecialReachSound =
                                true;

                            seImpactFlash.currentTime =
                                0;

                            seImpactFlash
                                .play()
                                .catch(
                                    e =>
                                        console.log(e)
                                );

                            elEffect.textContent =

                                "⚡🌈 インパクトフラッシュ発生！！ 🌈⚡";

                        }

                        // ----------------------------------------
                        // 2.
                        // ST中大当り
                        // ----------------------------------------

                        else if (
                            gameMode === "ST" &&
                            isWin &&
                            Math.random() <
                            impactFlashRates.ST
                        ){
                            isSpecialReachSound =
                                true;

                            seImpactFlash.currentTime =
                                0;

                            seImpactFlash
                                .play()
                                .catch(
                                    e =>
                                        console.log(e)
                                );

                            elEffect.textContent =
                                "⚡🌈 インパクトフラッシュ発生！！ 🌈⚡";
                        }

                        // ----------------------------------------
                        // 3.
                        // 時短中大当り
                        // ----------------------------------------

                        else if (

                            gameMode === "JITITAN" &&
                            isWin &&
                            Math.random() <
                            impactFlashRates.JITITAN
                        ){
                            isSpecialReachSound =
                                true;

                            seImpactFlash.currentTime =
                                0;

                            seImpactFlash
                                .play()
                                .catch(
                                    e =>
                                        console.log(e)
                                );

                            elEffect.textContent =
                                "⚡🌈 インパクトフラッシュ発生！！ 🌈⚡";
                        }

                        // ========================================
                        // 通常のリーチ音
                        // ========================================

                        else {
                            seReachNormal.currentTime =
                                0;

                            seReachNormal
                                .play()
                                .catch(
                                    e =>
                                        console.log(e)
                                );

                            elEffect.textContent =
                                "🔥 リーチ！！ 🔥";
                        }



                        // ========================================
                        // 中図柄変動
                        // ========================================

                        let centerStep =
                            0;

                        // 通常時50
                        // ST25
                        // 時短15

                        let centerSpinTime =
                            50;

                        if (
                            gameMode === "ST"
                        ){
                            centerSpinTime =
                                25;
                        }else if (
                            gameMode ===
                            "JITITAN"
                        ){
                            centerSpinTime =
                                15;
                        }

                        const centerInterval =

                            setInterval(() => {
                                centerStep++;

                                elReel2.textContent =
                                    getNextNum(
                                        elReel2.textContent
                                    );



                                // ========================================
                                // 中図柄停止
                                // ========================================

                                if (

                                    centerStep >=
                                    centerSpinTime
                                ){
                                    clearInterval(
                                        centerInterval
                                    );

                                    elReel2.textContent =
                                        targetCenter;



                                    // ========================================
                                    // 大当り
                                    // ========================================

                                    if (isWin) {

                                        recordWinHistory(
                                            isOddWin,
                                            targetCenter
                                        );



                                        // ========================================
                                        // 奇数当り
                                        // ========================================

                                        if (
                                            isOddWin
                                        ){
                                            elEffect.textContent =
                                                `【${targetCenter}揃い】ST「インパクトモード」突入！`;
                                            gameMode =
                                                "ST";
                                            modeRemains =
                                                RATES.ST_TURNS;
                                        }



                                        // ========================================
                                        // 偶数当り
                                        // ========================================

                                        else {

                                            elEffect.textContent =
                                                `【${targetCenter}揃い】「チャンスタイム(時短100回)」突入`;
                                            gameMode =
                                                "JITITAN";
                                            modeRemains =
                                                RATES.JITITAN_TURNS;
                                        }
                                    }


                                    // ========================================
                                    // ハズレ
                                    // ========================================

                                    else {

                                        elEffect.textContent =
                                            "ハズレ...";
                                    }
                                    finishSpin();
                                }
                            }, 60);
                    }


                    // ========================================
                    // リーチなし
                    // ========================================

                    else {

                        elReel2.textContent =
                            targetCenter;

                        finishSpin();
                    }
                }
            }, 50);
    }



    // ========================================
    // 大当り履歴
    // ========================================

    function recordWinHistory(

        isOddWin,
        winNum
    ){
        totalWinCount++;



        // 大当り時に回転数をリセット

        totalSpins =
            0;

        elTotalSpins.textContent =
            totalSpins;

        let typeName =
            "";
        let cssClass =
            "";



        // ========================================
        // ST中
        // ========================================

        if (
            gameMode === "ST"
        ){
            currentChain++;
            typeName =
                `${currentChain}連目 (ST中)`;
            cssClass =
                "tag-st";
        }


        // ========================================
        // 時短引き戻し
        // ========================================

        else if (
            gameMode === "JITITAN"
        ){

            currentChain++;
            typeName =
                `${currentChain}連目 (引き戻し)`;
            cssClass =
                "tag-st";
        }


        // ========================================
        // 初当り
        // ========================================

        else {

            currentChain =
                1;
            if (isOddWin) {
                typeName =
                    "初当り (RUSH突入)";
                cssClass =
                    "tag-st";
            }else {
                typeName =
                    "初当り (時短突入)";
                cssClass =
                    "tag-jititan";
            }
        }



        // ========================================
        // 最高連更新
        // ========================================

        if (
            currentChain >
            maxChain
        ){

            maxChain =
                currentChain;
        }



        // ========================================
        // 履歴追加
        // ========================================

        winHistory.unshift({
            count:
                totalWinCount,
            spins:
                spinAtLastWin,
            num:
                winNum,
            type:
                typeName,
            css:
                cssClass
        });



        spinAtLastWin =
            0;
        updateHistoryUI();
    }



    // ========================================
    // 履歴表示
    // ========================================

    function updateHistoryUI() {
        elTotalWins.textContent =
            totalWinCount;
        elMaxChain.textContent =
            maxChain;
        elHistoryList.innerHTML =
            "";
        winHistory
            .slice(0, 10)
            .forEach(item => {

                const li =

                    document.createElement(
                        'li'
                    );

                li.innerHTML = `
                    <span>
                        <b class="${item.css}">
                            ${item.type}
                        </b>
                        (${item.num}図柄)
                    </span>

                    <span>
                        <b>
                            ${item.spins}
                        </b>
                        回転目
                    </span>
                `;
                elHistoryList
                    .appendChild(li);
            });
    }



    // ========================================
    // 変動終了
    // ========================================

    function finishSpin() {

        // ========================================
        // ST / 時短終了
        // ========================================

        if (
            gameMode !== "NORMAL" &&
            modeRemains <= 0
        ){
            elEffect.textContent =
                `${
                    gameMode === "ST"
                        ? "ST"
                        : "時短"
                }終了...`;
            gameMode =
                "NORMAL";

            modeRemains =
                0;

            currentChain =
                0;
        }



        // ========================================
        // 変動時間記録
        // ========================================

        if (
            spinStartTime > 0
        ){
            lastSpinDuration =
                Math.round(
                    performance.now() -
                    spinStartTime
                );

            console.log(
                `[変動時間] ${lastSpinDuration}ms (${(
                    lastSpinDuration /
                    1000
                ).toFixed(2)}秒)`
            );
        }



        // ========================================
        // モード表示
        // ========================================

        if (
            gameMode === "ST"
        ){

            elMode.textContent =
                "インパクトモード (ST)";

            elMode.className =
                "mode-st";

            elStCount.textContent =
                `ST残り: ${modeRemains}回`;
        }

        else if (
            gameMode === "JITITAN"
        ){

            elMode.textContent =
                "チャンスタイム (時短)";

            elMode.className =
                "mode-jititan";

            elStCount.textContent =
                `時短残り: ${modeRemains}回`;
        }else {

            elMode.textContent =
                "通常モード";

            elMode.className =
                "mode-normal";

            elStCount.textContent =
                "";
        }



        // ========================================
        // 次の変動
        // ========================================

        setTimeout(() => {
            startNextSpin();
        }, 800);
    }



    // ========================================
    // スペースキー
    // ========================================

    window.addEventListener(
        'keydown',
        (e) => {

            if (
                e.code === 'Space'
            ){

                if (
                    e.target.tagName ===
                    'INPUT' ||
                    e.target.tagName ===
                    'TEXTAREA'
                ){
                    return;
                }

                e.preventDefault();

                if (
                    lastSpinDuration > 0
                ){
                    console.log(
                        `[手動確認 - 直前の変動時間] ${lastSpinDuration}ms (${(
                            lastSpinDuration /
                            1000
                        ).toFixed(2)}秒)`
                    );
                }
            }
        }
    );

</script>
